name: 예약 발송 큐 처리 (outbox)

# 예약 발송은 큐(outbox)에 쌓였다가 누군가 꺼내야 나간다.
# 전에는 관리자 페이지를 열 때만 큐가 돌아서, 예약해두고 화면을 안 열면 그 시각에 안 나갔다.
# 여기서 5분마다 두드려 준다. (GitHub Actions 스케줄은 최소 5분, 혼잡하면 몇 분 늦을 수 있다)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:        # 손으로 즉시 한 번 돌리고 싶을 때

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: 큐 비우기
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET 이 저장소 시크릿에 없습니다 — 예약 발송이 나가지 않습니다"
            exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 60 \
                 "https://rndsetup.com/api/cron/outbox?key=$CRON_SECRET")
          echo "HTTP $code"
          cat /tmp/out.json
          echo
          # 401 = 키 불일치, 5xx = 서버 오류 — 둘 다 실패로 잡아 메일 알림이 오게 둔다
          if [ "$code" != "200" ]; then
            echo "::error::큐 처리 실패 (HTTP $code)"
            exit 1
          fi
