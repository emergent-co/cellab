<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a2540">
<title>주문 요청 — 실험셋업연구소</title>
<link rel="canonical" href="https://rndsetup.com/order/">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0a2540;--teal:#1a6e56;--ink:#1a2332;--mut:#5a6779;--line:#e3e8ef;--bg:#f4f6fa}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;word-break:keep-all;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--navy);color:#fff;padding:calc(13px + env(safe-area-inset-top)) 16px 13px}
.top h1{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.top h1 a{margin-left:auto;color:#9fc3e8;text-decoration:none;font-size:12.5px;font-weight:600}
.top p{font-size:12.5px;color:#9fb3c8;margin-top:3px}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 100px}
.sec{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 15px;margin-bottom:11px}
.sec h2{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.3px;margin-bottom:12px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:11px 0 5px}
label:first-of-type{margin-top:0}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;background:#fbfcfe}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--teal);background:#fff}
textarea{min-height:84px;resize:vertical}
.req::after{content:' *';color:#C2410C}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:15.5px;font-weight:800;cursor:pointer}
.btn.pri{background:var(--teal);color:#fff}
.btn.pri:disabled{opacity:.5}
.btn.kakao{background:#FEE500;color:#191600}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--mut)}
.it{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;background:#fbfcfe;position:relative}
.it .row{display:flex;gap:6px;margin-top:6px}
.it .row .qty{flex:0 0 78px;text-align:center}
.it .row .unit{flex:0 0 68px;text-align:center}
.it .del{flex:1;border:0;background:#fee2e2;color:#991B1B;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.addbtn{width:100%;border:1px dashed #c3ccd8;background:#fff;border-radius:11px;padding:13px;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer}
.sug{position:absolute;left:12px;right:12px;top:52px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(10,37,64,.13);z-index:10;max-height:230px;overflow-y:auto}
.sug div{padding:11px 12px;font-size:13.5px;border-bottom:1px solid #f1f4f8;cursor:pointer}
.sug div:last-child{border-bottom:0}
.sug b{display:block;font-size:14px}
.sug small{color:var(--mut)}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.55}
.done{text-align:center;padding:44px 20px}
.done .no{font-size:22px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;margin:14px 0}
.err{background:#FEE2E2;color:#991B1B;border-radius:10px;padding:11px 13px;font-size:13.5px;font-weight:700;margin-bottom:11px}
.foot{text-align:center;font-size:12px;color:var(--mut);padding:18px 12px 30px;line-height:1.7}
</style>
</head>
<body>
<div class="top">
  <h1>주문 요청<a href="/order/my/">내 주문 →</a></h1>
  <p>실험셋업연구소 · 이머전트</p>
</div>
<div class="wrap" id="app"><div class="sec">불러오는 중…</div></div>
<div class="foot">이머전트 · 대표 이영현 · 사업자등록번호 328-03-02926<br>070-8983-2600 · info@rndsetup.com</div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, items = [{name:'',spec:'',unit:'EA',qty:1}];

const P = [['name','담당자명',1],['phone','연락처',1],['company','상호(회사·기관명)',1],['biz_no','사업자등록번호',1],
           ['ceo','대표자명',0],['email','이메일',1],['tax_email','세금계산서 수신 이메일',0],
           ['biz_type','업태',0],['biz_item','종목',0],['address','주소',0]];

async function boot(){
  const q = new URLSearchParams(location.search);
  if (q.get('err')) app.innerHTML = '<div class="err">로그인 처리 중 문제가 발생했습니다 ('+esc(q.get('err'))+'). 다시 시도해주세요.</div>';
  const r = await fetch('/api/auth/me').then(r=>r.json());
  me = r.login ? r.customer : null;
  if (!me) return viewLogin();
  if (!r.profileComplete) return viewProfile();
  viewOrder();
}

function viewLogin(){
  app.innerHTML += '<div class="sec"><h2>로그인</h2>'
   +'<p style="font-size:14px;margin-bottom:14px">카카오톡으로 로그인하면 주문요청과 진행상황 확인, 견적서·거래명세서 열람을 한 곳에서 하실 수 있습니다.</p>'
   +'<a class="btn kakao" style="text-align:center;text-decoration:none;display:block" href="/api/auth/kakao?next=/order/">카카오톡으로 시작하기</a>'
   +'<p class="hint">전화 문의: 070-8983-2600 · info@rndsetup.com</p></div>';
}

function viewProfile(){
  app.innerHTML = '<div class="sec"><h2>거래처 정보 (최초 1회)</h2>'
   + P.map(([k,l,req])=>'<label class="'+(req?'req':'')+'">'+l+'</label><input id="p-'+k+'" value="'+esc(me[k]||'')+'"'+(k==='email'||k==='tax_email'?' type="email" inputmode="email"':'')+(k==='phone'?' type="tel" inputmode="tel"':'')+'>').join('')
   +'<p class="hint">세금계산서 발행에 쓰이는 정보입니다. 이후 주문에서는 다시 입력하지 않으셔도 됩니다.</p>'
   +'</div><button class="btn pri" id="saveP">저장하고 주문하기</button>';
  $('#saveP').onclick = async ()=>{
    const b = {}; P.forEach(([k])=>b[k]=$('#p-'+k).value.trim());
    for (const [k,l,req] of P) if (req && !b[k]) return alert(l+'을(를) 입력해주세요.');
    const btn=$('#saveP'); btn.disabled=true; btn.textContent='저장 중…';
    const r = await fetch('/api/auth/me',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
    if (r.ok){ me = r.customer; viewOrder(); } else { btn.disabled=false; btn.textContent='저장하고 주문하기'; alert('저장 실패'); }
  };
}

function viewOrder(){
  app.innerHTML = '<div class="sec"><h2>주문 품목</h2><div id="itemBox"></div>'
   +'<button class="addbtn" id="addItem">+ 품목 추가</button></div>'
   +'<div class="sec"><h2>요청 정보</h2>'
   +'<label>주문 제목</label><input id="f-title" placeholder="예) 튜브퍼니스 + MFC 셋업">'
   +'<label>희망 납기일</label><input id="f-want" type="date">'
   +'<label>납품 주소</label><input id="f-ship" value="'+esc(me.address||'')+'" placeholder="납품받으실 주소">'
   +'<label>요청사항</label><textarea id="f-note" placeholder="사양·조건·예산·설치 관련 요청을 적어주세요"></textarea>'
   +'<p class="hint">단가는 요청 접수 후 담당자가 확인하여 견적서로 회신드립니다.</p></div>'
   +'<button class="btn pri" id="submitBtn">주문 요청 보내기</button>'
   +'<div style="height:9px"></div><button class="btn ghost" id="editP">거래처 정보 수정</button>';
  $('#addItem').onclick = ()=>{ items.push({name:'',spec:'',unit:'EA',qty:1}); renderItems(); };
  $('#editP').onclick = viewProfile;
  $('#submitBtn').onclick = submit;
  renderItems();
}

function renderItems(){
  const box = $('#itemBox');
  box.innerHTML = items.map((it,i)=>
    '<div class="it" data-i="'+i+'">'
    +'<input class="f-name" placeholder="품명 · 모델명으로 검색" value="'+esc(it.name)+'" autocomplete="off">'
    +'<input class="f-spec" placeholder="규격 / 사양 (선택)" value="'+esc(it.spec||'')+'">'
    +'<div class="row"><input class="unit f-unit" value="'+esc(it.unit||'EA')+'">'
      +'<input class="qty f-qty" type="number" inputmode="numeric" min="1" value="'+(it.qty||1)+'">'
      +(items.length>1?'<button class="del">삭제</button>':'<span style="flex:1"></span>')
    +'</div></div>').join('');
  box.querySelectorAll('.it').forEach(el=>{
    const i = +el.dataset.i;
    const nm = el.querySelector('.f-name');
    nm.oninput = e=>{ items[i].name=e.target.value; suggest(el,i,e.target.value); };
    nm.onblur = ()=>setTimeout(()=>{ const s=el.querySelector('.sug'); if(s) s.remove(); },180);
    el.querySelector('.f-spec').oninput = e=>items[i].spec=e.target.value;
    el.querySelector('.f-unit').oninput = e=>items[i].unit=e.target.value;
    el.querySelector('.f-qty').oninput  = e=>items[i].qty=+e.target.value;
    const d = el.querySelector('.del'); if(d) d.onclick=()=>{ items.splice(i,1); renderItems(); };
  });
}

let st;
function suggest(el,i,q){
  clearTimeout(st);
  const old = el.querySelector('.sug'); if(old) old.remove();
  if (q.trim().length < 2) return;
  st = setTimeout(async ()=>{
    const r = await fetch('/api/order/products?q='+encodeURIComponent(q.trim())).then(r=>r.json()).catch(()=>({items:[]}));
    if (!r.items || !r.items.length) return;
    const box = document.createElement('div'); box.className='sug';
    box.innerHTML = r.items.map(p=>'<div data-pid="'+p.id+'" data-nm="'+esc(p.name||p.model)+'" data-sp="'+esc(p.model||'')+'"><b>'+esc(p.name||p.model)+'</b><small>'+esc([p.brand,p.model,p.sobun].filter(Boolean).join(' · '))+'</small></div>').join('');
    el.appendChild(box);
    box.querySelectorAll('div[data-pid]').forEach(d=>d.onmousedown=()=>{
      items[i].name = d.dataset.nm; items[i].spec = d.dataset.sp; items[i].product_id = +d.dataset.pid;
      renderItems();
    });
  }, 260);
}

async function submit(){
  const good = items.filter(i=>(i.name||'').trim());
  if (!good.length) return alert('품목을 1개 이상 입력해주세요.');
  const btn = $('#submitBtn'); btn.disabled=true; btn.textContent='보내는 중…';
  const body = { items: good, title: $('#f-title').value, want_date: $('#f-want').value,
                 ship_address: $('#f-ship').value, request_note: $('#f-note').value };
  const r = await fetch('/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  if (r.ok){
    app.innerHTML = '<div class="sec done"><div style="font-size:15px;font-weight:700">주문 요청이 접수되었습니다</div>'
      +'<div class="no">'+esc(r.order_no)+'</div>'
      +'<p style="font-size:13.5px;color:var(--mut)">담당자가 확인 후 견적서를 보내드립니다.<br>진행상황은 “내 주문”에서 확인하실 수 있습니다.</p>'
      +'<div style="height:18px"></div><a class="btn pri" style="text-decoration:none;text-align:center;display:block" href="/order/my/">내 주문 보기</a></div>';
    window.scrollTo(0,0);
  } else {
    btn.disabled=false; btn.textContent='주문 요청 보내기';
    alert(r.message || '전송에 실패했습니다.');
  }
}
boot();
</script>
</body>
</html>
