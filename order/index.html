<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>주문·정산 — 실험셋업연구소</title>
<link rel="canonical" href="https://rndsetup.com/order/">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1e3a8a;--ink:#1f2333;--mut:#6b7280;--line:#e8eaef;--bg:#f7f8fa;
  --teal:#1a6e56;--side:240px;--head:64px;
}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.55;word-break:keep-all;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ---------- 로그인 ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:38px 30px;width:100%;max-width:430px;text-align:center}
.login .bd{font-size:20px;font-weight:800;letter-spacing:-.02em}
.login .bd small{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:3px}
.login p{font-size:14px;color:var(--mut);margin:20px 0 22px;line-height:1.6}
.kakao{display:block;width:100%;background:#FEE500;color:#191600;border:0;border-radius:11px;padding:15px;font-size:15.5px;font-weight:800;cursor:pointer}

/* ---------- 셸 ---------- */
.shell{display:none;min-height:100vh}
.shell.on{display:block}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--line);z-index:30;display:flex;flex-direction:column}
.brand{display:block;padding:26px 22px 24px;text-align:center;border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit;transition:background .14s}
.brand:hover{background:#f6f8fc}
.brand:hover b{color:var(--navy)}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.brand small{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-top:2px}
.nav{padding:14px 0;flex:1}
.nav a{display:block;padding:16px 22px;font-size:15px;font-weight:700;color:var(--mut);border-left:4px solid transparent;cursor:pointer}
.nav a:hover{background:#fafbfc}
.nav a.on{color:var(--ink);font-weight:800;border-left-color:var(--navy);background:#f4f6fb}
.labbox{padding:14px 18px;border-top:1px solid var(--line)}
.labnone{font-size:11.5px;color:#9aa1ad;line-height:1.6}
.labname{font-size:13px;font-weight:800;line-height:1.35}
.labcode{font-size:11.5px;color:var(--mut);margin-top:3px}
.labcode b{color:var(--ink);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.labbtn{width:100%;margin-top:10px;border:1px solid #c7d9f7;background:#f2f6ff;color:#1E40AF;
  border-radius:9px;padding:9px;font-size:12.5px;font-weight:800;cursor:pointer}
.labbtn:hover{background:#e6efff}
.invrow{display:flex;gap:7px;margin-top:12px}
.invrow input{flex:1;background:#f7f8fa;font-size:13px}
.btn.kakao2{width:100%;margin-top:9px;background:#FEE500;color:#191600;padding:14px;font-size:15px}
.invcode{margin-top:16px;text-align:center;font-size:13px;color:var(--mut);
  background:#f7f8fa;border-radius:10px;padding:12px}
.invcode b{font-size:19px;color:var(--ink);letter-spacing:.14em;display:block;margin:4px 0 2px}
.invcode small{font-size:11.5px}
.who .worg{color:var(--ink);font-weight:700;margin-right:6px}
.who .worg:not(:empty)::after{content:'·';color:#c3c8d0;margin-left:6px;font-weight:400}
.side .foot{padding:16px 22px 22px;font-size:11.5px;color:#9aa1ad;line-height:1.65;border-top:1px solid var(--line)}

.head{position:fixed;left:var(--side);right:0;top:0;height:var(--head);background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 26px;z-index:20}
.head h1{font-size:17px;font-weight:800}
.head .who{margin-left:auto;font-size:13.5px;color:var(--mut)}
.head .who b{color:var(--ink);font-weight:700}
.head .who button{background:0;border:0;color:var(--mut);font-size:13.5px;cursor:pointer;margin-left:14px}
.head .who button:hover{color:var(--ink);text-decoration:underline}
.head .burger{display:none;background:0;border:0;font-size:22px;line-height:1;margin-right:14px;cursor:pointer}

.main{margin-left:var(--side);padding:calc(var(--head) + 26px) 26px 70px}
.ttl{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:18px}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:0;border:0;padding:0 0 12px;font-size:14.5px;font-weight:700;color:var(--mut);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button i{font-style:normal;font-size:11.5px;font-weight:800;background:#eef1f6;color:var(--mut);
  border-radius:999px;padding:2px 7px;margin-left:5px}
.tabs button.on i{background:var(--ink);color:#fff}
tbody tr.act{background:#fffdf5}
tbody tr.act:hover{background:#fffaea}
tbody tr.act td:first-child{box-shadow:inset 3px 0 0 #F59E0B}
.twobtn{display:flex;gap:8px;margin-top:10px}
.twobtn .btn{flex:1;padding:14px}
.actbox{margin-top:16px;font-size:13.5px;font-weight:700;color:#92400E;background:#FEF3C7;
  border-radius:10px;padding:12px 14px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px 20px}
.kpi.hi{border-color:#c7d2fe;background:#f8faff}
.kpi span{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:24px;font-weight:800;text-align:right;margin-top:14px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b i{font-style:normal;font-size:13px;font-weight:600;color:var(--mut);margin-left:3px}

/* ---------- 툴바 ---------- */
.tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tools input[type=search]{flex:1;min-width:200px;max-width:360px;border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:14px;background:#fff}
.btn{border:0;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--navy);color:#fff}
.btn.ok{background:var(--teal);color:#fff}
.btn.gray{background:#e9ebef;color:#4b5563}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--mut)}
.btn:disabled{opacity:.5;cursor:default}
.tools .right{margin-left:auto;display:flex;gap:8px}

/* ---------- 목록 + 상세 ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--mut);font-weight:700;padding:13px 10px;border-bottom:1px solid var(--line);background:#fcfcfd}
td{padding:14px 10px;border-bottom:1px solid #f2f4f7;text-align:center;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fafbfd}
tbody tr.sel{background:#f4f6fb}
td.l{text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.s0{background:#FEF3C7;color:#92400E}.s1{background:#DBEAFE;color:#1E40AF}.s2{background:#D1FAE5;color:#065F46}
.s3{background:#EDE9FE;color:#5B21B6}.s4{background:#F3E8FF;color:#6B21A8}.s5{background:#CFFAFE;color:#155E75}
.s6{background:#DCFCE7;color:#166534}.s7{background:#F1F5F9;color:#475569}.s8{background:#FEE2E2;color:#991B1B}
.empty{padding:64px 20px;text-align:center;color:#9aa1ad;font-size:14px}
/* 대시보드 요약 — 상자 없이 텍스트 한 줄 */
.sumline{font-size:13px;color:var(--mut);margin:-2px 0 14px;font-variant-numeric:tabular-nums}
.sumline b{color:var(--ink);font-weight:800}
.sumline em{font-style:normal;color:#B45309;font-weight:800}
/* 주문 목록 행 — 한 줄로 */
table.orders td{padding:10px}
table.orders td.ttd{max-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.orders td.ttd b{font-weight:700}
table.orders td.ttd .rmeta{margin-left:9px;font-size:12px}
table.orders td.dt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.lnk2{color:inherit;text-decoration:underline;text-decoration-color:#cfd5df;text-underline-offset:2px}
/* 홈 — 바로가기 타일 */
.hi{margin-bottom:18px}
.hi b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em}
.hi span{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px 16px;
  text-align:left;cursor:pointer;transition:.14s;font:inherit;color:inherit}
.tile:hover{border-color:#c9d2e4;box-shadow:0 4px 14px rgba(22,34,64,.07);transform:translateY(-1px)}
.tile svg{width:26px;height:26px;color:var(--navy);margin-bottom:10px}
.tile b{font-size:15px;font-weight:800}
.tile span{font-size:12.5px;color:var(--mut);line-height:1.45}
.tile.pri{background:var(--navy);border-color:var(--navy)}
.tile.pri svg{color:#fff}.tile.pri b{color:#fff}.tile.pri span{color:#c7d2e8}
.tile.sm{flex-direction:row;align-items:center;gap:12px;padding:14px 16px}
.tile.sm svg{margin:0;width:22px;height:22px;flex:0 0 auto}
.tile.sm b{font-size:14px}
.tile.sm span{font-size:12px;margin-left:auto;text-align:right}
.tile .tb{position:absolute;right:12px;top:12px;font-style:normal;font-size:11px;font-weight:800;
  padding:3px 8px;border-radius:999px;background:#eef1f6;color:#475569}
.tile.hot .tb{background:#FEE2E2;color:#991B1B}
.tile.pri .tb{background:rgba(255,255,255,.18);color:#fff}
.panel.pad{padding:18px 18px 16px;margin-bottom:12px}
.panel.pad .kv{padding:7px 0;border-bottom:1px solid #f4f6f9}
.panel.pad .kv:last-child{border-bottom:0}
.panel.pad .kv>span:first-child{flex:0 0 108px;color:var(--mut)}
.ordbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 10px;font-size:13px;
  background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.ordbar b{font-size:14px;font-weight:800}
.ordbar span{color:var(--mut);font-variant-numeric:tabular-nums}
.dbody{margin-top:4px}
.dbody .actbox,.dbody .okbox{margin-top:2px}
.dbody .twobtn,.dbody .btn.ok{margin-bottom:16px}
.omodal .mbox{max-width:720px;padding:20px 22px 22px}
.omodal .mbox h3{display:flex;align-items:center;gap:9px;padding-right:34px}
.omodal .mbox h3 .no{font-size:13px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
/* 목록 행에서 바로 보이는 것들 */
.todo{display:inline-block;margin-left:7px;font-style:normal;font-size:10.5px;font-weight:800;
  padding:2px 7px;border-radius:999px;background:#FEF3C7;color:#92400E;white-space:nowrap;vertical-align:1px}
.rmeta{color:var(--mut);font-variant-numeric:tabular-nums}
.dim{color:#b3b9c4;font-weight:600;font-size:12.5px}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dh .no{font-size:12.5px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
.dt2{font-size:17px;font-weight:800;margin-bottom:16px}
.sec{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}
.sec h4{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.3px;margin-bottom:10px}
.kv{display:flex;gap:12px;font-size:13.5px;padding:4px 0}
.kv span:first-child{color:var(--mut);flex:0 0 76px}
.kv span:last-child{flex:1}
.sum{display:flex;justify-content:space-between;font-size:16px;font-weight:800;padding-top:11px;border-top:1px solid var(--line);margin-top:8px;font-variant-numeric:tabular-nums}
.ev{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev time{flex:0 0 86px;color:var(--mut);font-variant-numeric:tabular-nums}
.warnbox{font-size:13px;color:#92400E;background:#FEF3C7;border-radius:9px;padding:11px 13px;line-height:1.55}
.okbox{font-size:13px;color:#065F46;background:#D1FAE5;border-radius:9px;padding:11px 13px}
.lnk{background:0;border:0;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer;padding:0;margin-right:14px}

.split2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.panel.pad{padding:20px 22px;position:relative}
.ph2{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.2px;margin-bottom:4px}
.ph2 .cnt{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;font-size:11.5px;padding:2px 9px;margin-left:6px}
.seg{display:flex;gap:6px;background:#f1f3f6;border-radius:10px;padding:4px;margin-bottom:6px}
.seg button{flex:1;border:0;background:0;border-radius:8px;padding:10px 4px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,28,48,.10)}
.oneform{position:relative}
.two{display:flex;gap:10px}
.two>div{flex:1}
.cartlist{margin-top:10px}
.cartrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f2f4f7}
.cartrow:last-child{border-bottom:0}
.cartrow .cn{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.cartrow .cn b{display:block;font-weight:700}
.cartrow .cn small{display:block;color:var(--mut);font-size:12px}
.cartrow .cn .ln{display:inline-block;font-size:11.5px;color:var(--teal);font-weight:700;margin-top:2px}
.cartrow .cq{flex:0 0 62px;text-align:center;padding:7px;font-size:13.5px}
.cartrow .cx{flex:0 0 30px;height:30px;border:0;background:#f1f3f6;color:#6b7280;border-radius:8px;font-size:17px;cursor:pointer}
.cartrow .cx:hover{background:#fee2e2;color:#991B1B}
table.mini{margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.mini th,table.mini td{padding:8px 6px;font-size:12.5px}
.hint{font-size:12.5px;color:var(--mut);line-height:1.55}
.sitebox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sitebox .ph2{display:flex;align-items:center}
.mini{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--mut);cursor:pointer}
.mini:hover{border-color:#c3ccd8;color:var(--ink)}
.radio{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;margin-bottom:7px;cursor:pointer;font-weight:400}
.radio.on{border-color:#93a4c8;background:#f8faff}
.radio input{width:17px;height:17px;flex:0 0 17px;margin:0}
.radio div{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.radio div b{display:block;font-weight:700}
.radio div small{display:block;color:var(--mut);font-size:12px}
.radio .sx{flex:0 0 26px;height:26px;border:0;background:0;color:#b6bcc6;font-size:16px;cursor:pointer}
.radio .sx:hover{color:#991B1B}
.addrrow{display:flex;gap:7px}
.addrrow input{flex:1}
.addrrow .btn{flex:0 0 auto;padding:11px 14px}
.pcwrap{display:none;height:420px;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.skel{display:grid;gap:14px}
.sk{background:linear-gradient(90deg,#eef0f4 25%,#f6f7f9 37%,#eef0f4 63%);
  background-size:400% 100%;border-radius:12px;animation:shim 1.3s ease infinite}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.waitbox{text-align:center;padding:34px 16px}
.waitbox b{display:block;font-size:14.5px;margin-top:14px}
.waitbox small{display:block;font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.55}
.spin{width:30px;height:30px;margin:0 auto;border:3px solid var(--line);border-top-color:var(--navy);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sug .mine{display:inline-block;font-size:10.5px;font-weight:700;background:#DBEAFE;color:#1E40AF;
  border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
/* 최근 주문 — 이전에 산 것이라는 게 한눈에 보이게 파란 계열 */
.recent .cartrow{background:#f2f6ff;border:1px solid #dbe6fb;border-radius:10px;
  padding:11px 13px;margin-bottom:7px}
.recent .cartrow .cn b{color:#1E3A8A}
.recent .cartrow .cn small{color:#5b7bb5}
.recent .cartrow .radd{background:#fff;border-color:#c7d9f7;color:#1E40AF;font-weight:700}
.recent .cartrow .radd:hover{background:#e8f0ff}
.sug div.mrow2{background:#f7faff}

.kbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-bottom:14px}
.kbar>div{padding:13px 16px;border-right:1px solid var(--line);min-width:0}
.kbar>div:last-child{border-right:0}
.kbar>div.hi{background:#f8faff}
.kbar span{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.kbar b{display:block;font-size:18px;font-weight:800;margin-top:3px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbar>div.hi b{color:var(--navy)}
.billbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:16px}
.billbar .bb{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:13px;color:var(--mut)}
.billbar .bb b{font-size:14px;color:var(--ink);font-weight:700}
.billbar .bb em{font-style:normal;font-size:12px;color:#9aa1ad}
.billbar .bb.none{color:#92400E}
.fold{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:8px;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'▸';color:#9aa1ad;font-size:12px;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary i{font-style:normal;font-size:11.5px;font-weight:800;background:#eef1f6;color:var(--mut);
  border-radius:999px;padding:2px 8px}
.fold>summary:hover{background:#fafbfd}
.foldin{border-top:1px solid var(--line)}
.ttlrow{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ttlrow .btn{margin-left:auto}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.scard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;position:relative;overflow:hidden}
.scard.done{background:#fcfcfd;border-color:#eceef2}
.scard.done .sc2,.scard.done .sc3,.scard.done .sc4{opacity:.45}
.scard.rej{border-color:#f2c9c9}
.sc1{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sc1 .sdate{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}

<script>
/* 채널톡 로더 — 페이지 로드가 끝난 뒤 비동기로 붙는다(초기 렌더를 막지 않음) */
(function(){var w=window;if(w.ChannelIO){return;}var ch=function(){ch.c(arguments);};ch.q=[];
ch.c=function(a){ch.q.push(a);};w.ChannelIO=ch;
function l(){if(w.ChannelIOInitialized){return;}w.ChannelIOInitialized=true;
var s=document.createElement("script");s.type="text/javascript";s.async=true;
s.src="https://cdn.channel.io/plugin/ch-plugin-web.js";
var x=document.getElementsByTagName("script")[0];if(x.parentNode){x.parentNode.insertBefore(s,x);}}
if(document.readyState==="complete"){l();}else{w.addEventListener("load",l);}})();
</script>

<script>
const $ = function(s){ return document.querySelector(s); };
const esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
const won = function(n){ return Number(n||0).toLocaleString('ko-KR'); };
const ST = ['요청접수','견적발송','견적승인','발주확정','배송중','수령확인','계산서발행','완료','보류','취소'];
const SIDX = {}; ST.forEach(function(s,i){ SIDX[s]=i; });
// 고객이 읽는 말로 바꾼다 — 내부 단계명(견적발송/발주확정…)은 관리자만 본다
const SLABEL = { '요청접수':'접수됨', '견적발송':'확인 중', '견적승인':'주문 확정',
  '발주확정':'주문 확정', '배송중':'배송중', '수령확인':'수령 확인',
  '계산서발행':'계산서 발행', '완료':'완료', '보류':'보류', '취소':'취소' };
// 고객이 직접 눌러야 넘어가는 단계는 '수령 확인' 하나뿐이다.
// (가격은 상품 URL에서 보고 접수하므로 견적 승인 절차가 없다)
const GROUP = {
  '확인 필요': ['배송중'],
  '진행 중':  ['요청접수','견적발송','견적승인','발주확정','수령확인','계산서발행','보류'],
  '완료':     ['완료','취소'],
};
const DT = {quote:'견적서',statement:'거래명세서',taxinvoice:'세금계산서'};
const CH_KEY = '9ef4232c-59bb-4911-a4c7-363c6b5bc513';

let me=null, lab=null, view='home', tab='전체', kw='', orders=[], cur=null;
// 주문자 — 서류·연락이 실제로 가는 곳. 카카오 계정 메일은 개인 메일일 때가 많아 따로 받는다.
let ord = { name:'', email:'', phone:'' };
function syncOrd(){
  if (!me) return;
  ord = { name: me.name||'', email: me.work_email || me.email || '', phone: me.phone||'' };
}
function ordOk(){ return !!(ord.name && ord.email && ord.phone); }
let cart=[], mode='one';   // mode: one=단건, bulk=여러 건
try { cart = JSON.parse(localStorage.getItem('rs_cart')||'[]') || []; } catch(e){ cart=[]; }
function saveCart(){ try{ localStorage.setItem('rs_cart', JSON.stringify(cart)); }catch(e){} }

function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},1900); }
function badge(s){ return '<span class="badge s'+(SIDX[s]==null?7:SIDX[s])+'">'+esc(SLABEL[s]||s)+'</span>'; }

/* ---------------- 부팅 ---------------- */
async function boot(){
  var qs  = new URLSearchParams(location.search);
  var inv = qs.get('inv');    // 실험실 합류 초대
  var ref = qs.get('ref');    // 서비스 추천 (실험실과 무관)

  var r = await fetch('/api/auth/me').then(function(r){return r.json();}).catch(function(){return {};});
  if (!r.login){
    $('#login').style.display='flex'; bootChannel(null);
    if (inv || ref){
      $('#kakaoBtn').dataset.next = '/order/?' + (inv ? 'inv='+encodeURIComponent(inv) : 'ref='+encodeURIComponent(ref));
      if (inv) peekLab(inv);
    }
    return;
  }
  me = r.customer; lab = r.lab || null;
  if (lab) lab.members = (r.members||[]).length;

  if (ref){
    fetch('/api/order/lab',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({ref:ref})});
    history.replaceState({}, '', '/order/' + (location.hash||''));
  }
  if (inv){
    history.replaceState({}, '', '/order/' + (location.hash||''));
    setTimeout(function(){ joinAsk(inv); }, 300);
  }
  $('#login').style.display='none';
  $('#shell').classList.add('on');
  syncOrd();
  $('#whoName').textContent = me.name || '고객';
  $('#whoOrg').textContent = (lab && lab.name) || me.company || '';
  paintLab();
  var h0 = location.hash.replace('#','');
  if (VIEWS.indexOf(h0)>=0) view=h0;
  syncNav();
  bootChannel(me);
  render();
}

// 로그인한 고객이면 이름·연락처를 같이 넘겨, 상담 시작할 때 누구인지 바로 보이게 한다.
//   ※ memberId 는 memberHash 없이 넘기면 채널톡 boot 이 401 로 죽는다(상담창이 안 열림).
//     서버에서 해시를 받아왔을 때만 회원으로 붙이고, 아니면 익명으로 붙인다.
var chReady = false;
function chProfile(c){
  if (!c) return null;
  var pr = { name: c.name || '', email: c.work_email || c.email || '', mobileNumber: c.phone || '' };
  return pr;
}
function chBoot(cfg, onFail){
  try {
    ChannelIO('boot', cfg, function(err){
      if (err){ chReady = false; if (onFail) onFail(err); return; }
      chReady = true;
    });
  } catch(e){ if (onFail) onFail(e); }
}
function bootChannel(c){
  if (!window.ChannelIO) return;
  var base = { pluginKey: CH_KEY };
  var pr = chProfile(c);
  if (pr) base.profile = pr;

  if (!c){ chBoot(base); return; }

  fetch('/api/auth/channel').then(function(r){ return r.json(); }).catch(function(){ return {}; })
    .then(function(r){
      var cfg = Object.assign({}, base);
      if (r && r.member && r.member.memberHash){
        cfg.memberId = r.member.memberId;
        cfg.memberHash = r.member.memberHash;
      }
      // 회원으로 붙다 실패하면 익명으로라도 붙인다 — 상담은 되어야 한다
      chBoot(cfg, function(){ try { ChannelIO('shutdown'); } catch(e){} chBoot(base); });
    });
}

var KAKAO_JS_KEY = '0a94da22a52f432b1f77d9fb2deafdf6';
function shareKakao(url, isLab){
  var text = isLab
    ? (lab ? lab.name : '실험실') + ' 주문 페이지에 초대합니다.\n실험셋업연구소(이머전트)에서 함께 주문하고 정산 서류를 받으실 수 있습니다.'
    : '실험실 주문·정산을 한 곳에서 처리하는 서비스입니다.\n시약·소모품·장비를 주문하면 견적서·거래명세서·세금계산서까지 받으실 수 있습니다.';
  loadKakao(function(ok){
    if (ok){
      try {
        Kakao.Share.sendDefault({
          objectType: 'text', text: text,
          link: { mobileWebUrl: url, webUrl: url },
          buttons: [{ title: isLab ? '실험실 합류하기' : '주문 페이지 열기', link: { mobileWebUrl: url, webUrl: url } }],
        });
        return;
      } catch(e){}
    }
    // SDK를 못 쓰면 기기 공유 시트(카톡 포함)
    if (navigator.share) {
      navigator.share({ title:'실험셋업연구소 주문', text:text, url:url })
        .catch(function(){ pasteFallback(url, text); });
      return;
    }
    pasteFallback(url, text);
  });
}

// 카카오 공유가 안 될 때 — 조용히 실패하지 않고 붙여넣을 것을 눈앞에 띄운다
function pasteFallback(url, text){
  var body = text + '\n' + url;
  var w = modal('카카오톡으로 보내기',
     '<p class="hint" style="margin-top:10px">이 기기에서는 바로 보내기가 열리지 않습니다. '
    +'아래 내용을 복사해 카카오톡에 붙여넣어 주세요.</p>'
    +'<textarea id="pf-t" rows="4" readonly style="width:100%;margin-top:10px">'+esc(body)+'</textarea>'
    +'<div class="mrow"><button class="btn gray" data-x>닫기</button>'
      +'<button class="btn pri" id="pf-c">복사하기</button></div>');
  $('#pf-c').onclick = async function(){
    try { await navigator.clipboard.writeText(body); }
    catch(e){ var t=$('#pf-t'); t.select(); document.execCommand('copy'); }
    $('#pf-c').textContent = '복사됨';
  };
}
function loadKakao(cb){
  if (window.Kakao && window.Kakao.isInitialized && window.Kakao.isInitialized()) return cb(true);
  if (window.Kakao){ try { Kakao.init(KAKAO_JS_KEY); return cb(true); } catch(e){ return cb(false); } }
  var s = document.createElement('script');
  s.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js';
  s.integrity = 'sha384-DKYJZ8NLiK8MN4/C5P2dtSmLQ4KwPaoqAfyA/DfmEc1VDxu4yyC7wy6K1Hs90nka';
  s.crossOrigin = 'anonymous';
  s.onload = function(){ try { Kakao.init(KAKAO_JS_KEY); cb(true); } catch(e){ cb(false); } };
  s.onerror = function(){ cb(false); };
  document.head.appendChild(s);
}

/* ---------------- 주문 현황 ---------------- */
async function viewOrders(){
  if (cache.orders){ orders = cache.orders; paintOrders(); }
  var r = await fetch('/api/order').then(function(r){return r.json();}).catch(function(){return {};});
  if (!r.orders) { if(!cache.orders) paintOrders(); return; }
  orders = r.orders; cache.orders = orders;
  paintOrders();
}

function paintOrders(){
  var org = (orders.find(function(o){ return o.org_name; })||{}).org_name || me.company || '';
  var total = orders.length;
  var wait = orders.filter(function(o){ return GROUP['확인 필요'].indexOf(o.status)>=0; }).length;
  var amt = orders.reduce(function(s,o){ return s + (o.total_amount||0); },0);

  $('#main').innerHTML =
    '<div class="ttl">'+(org?esc(org)+' ':'')+'주문 목록</div>'
   +'<div class="tabs" id="tabs">'
     +['전체','확인 필요','진행 중','완료'].map(function(s){
        var c = s==='전체' ? orders.length : orders.filter(function(o){ return (GROUP[s]||[]).indexOf(o.status)>=0; }).length;
        return '<button class="'+(s===tab?'on':'')+'" data-t="'+esc(s)+'">'+esc(s)
          + (c? '<i>'+c+'</i>' : '') + '</button>'; }).join('')
   +'</div>'
   +'<div class="sumline">주문 <b>'+total+'</b>건'
     +(wait?' · <em>확인 필요 '+wait+'건</em>':'')
     +' · 누적 <b>'+won(amt)+'</b>원</div>'
   +'<div class="tools">'
     +'<input type="search" id="q" placeholder="주문번호 · 품명으로 검색" value="'+esc(kw)+'">'
   +'</div>'
   +'<div class="panel list" id="listPanel">'+listTable()+'</div>';

  $('#tabs').onclick = function(e){ var b=e.target.closest('button[data-t]'); if(!b) return;
    tab=b.dataset.t; cur=null; viewOrders(); };
  var t; $('#q').oninput = function(e){ clearTimeout(t); t=setTimeout(function(){ kw=e.target.value.trim(); viewOrders(); },280); };
  bindRows();
}

function filtered(){
  return orders.filter(function(o){
    if (tab!=='전체' && (GROUP[tab]||[]).indexOf(o.status)<0) return false;
    if (kw){ var s=(o.order_no+' '+(o.title||'')).toLowerCase(); if (s.indexOf(kw.toLowerCase())<0) return false; }
    return true;
  });
}

// 행에서 바로 해야 할 일이 보이게 — 눌러보지 않아도 알 수 있어야 한다
function todoChip(st){
  if (st==='배송중') return '<em class="todo">수령 확인</em>';
  return '';
}
// 납품지는 앞부분만 (동/구 정도까지)
function shortAddr(a){
  a = String(a||'').trim(); if (!a) return '';
  var p = a.split(/\s+/); return p.slice(0, Math.min(3, p.length)).join(' ');
}

function listTable(){
  var rows = filtered();
  if (!rows.length) return '<div class="empty">해당하는 주문이 없습니다.</div>';
  return '<table class="cards orders"><thead><tr><th style="width:88px">상태</th><th>주문 내용</th>'
    +'<th style="width:88px">요청일</th><th style="width:112px">금액</th></tr></thead><tbody>'
    + rows.map(function(o){
      var meta = [esc(o.order_no)];
      if (o.item_count>1) meta.push(o.item_count+'건');
      var ad = shortAddr(o.ship_address); if (ad) meta.push(esc(ad));
      return '<tr data-id="'+o.id+'" class="'+(GROUP['확인 필요'].indexOf(o.status)>=0?'act':'')+'">'
        +'<td>'+badge(o.status)+'</td>'
        +'<td class="l ttd"><b>'+esc(o.title||'(품목 없음)')+'</b>'+todoChip(o.status)
          +'<small class="rmeta">'+meta.join(' · ')+'</small></td>'
        +'<td class="dt">'+esc(String(o.created_at||'').slice(2,10))+'</td>'
        +'<td class="n">'+(o.total_amount?won(o.total_amount)+'원':'<span class="dim">확인 중</span>')+'</td></tr>';
    }).join('') + '</tbody></table>';
}

function bindRows(){
  document.querySelectorAll('#listPanel tbody tr').forEach(function(tr){
    tr.onclick = function(){ openOrder(Number(tr.dataset.id)); };
  });
}

function closeOrderModal(){
  var m = document.querySelector('.modal.omodal'); if (m) m.remove();
}

// 팝업 머리 — 목록에 이미 있는 값만으로 즉시 그린다 (네트워크를 기다리지 않는다)
function detailHead(o){
  return '<div class="dt2">'+esc(o.title||'')+'</div>'
   + actionBlock(o)
   +'<div class="kv"><span>소속</span><span>'+esc(o.org_name||'—')+'</span></div>'
   +'<div class="kv"><span>요청일</span><span>'+esc(String(o.created_at||'').slice(0,16))+'</span></div>'
   +'<div class="kv"><span>납품지</span><span>'+esc(o.ship_address||'—')+'</span></div>'
   +(o.orderer_name
      ? '<div class="kv"><span>주문자</span><span>'+esc(o.orderer_name)
        +(o.orderer_email?' · '+esc(o.orderer_email):'')
        +(o.orderer_phone?' · '+esc(o.orderer_phone):'')+'</span></div>'
      : '')
   +(o.request_note?'<div class="kv"><span>요청사항</span><span>'+esc(o.request_note)+'</span></div>':'');
}
function detailTitle(w, o){
  var h3 = w.querySelector('h3');
  if (h3) h3.innerHTML = '<span class="no">'+esc(o.order_no||'')+'</span> '+(o.status?badge(o.status):'');
}

async function openOrder(id){
  cur = id;
  closeOrderModal();
  // 목록에 있는 정보로 팝업을 먼저 완성한다 — 누르는 즉시 읽을 게 있어야 한다
  var lite = null;
  for (var i=0;i<orders.length;i++) if (orders[i].id===id) lite = orders[i];
  var w = modal('주문 상세',
    '<div class="dbody" id="detail">'
    + (lite ? detailHead(lite) : '')
    + '<div class="sec"><h4>품목</h4><div class="skel">'
      + '<div class="sk" style="height:46px"></div><div class="sk" style="height:46px"></div></div></div>'
    + '</div>');
  w.classList.add('omodal');
  if (lite) detailTitle(w, lite);
  w.addEventListener('click', function(e){ if (e.target===w || e.target.hasAttribute('data-x')) cur=null; });
  if (lite) bindActions(id, lite);          // 수령 확인 버튼은 바로 눌릴 수 있어야 한다

  var d = await fetch('/api/order/'+id).then(function(r){return r.json();}).catch(function(){return {error:1};});
  if (!document.body.contains(w)) return;          // 그새 닫았으면 그만
  if (d.error){
    if (!lite) $('#detail').innerHTML = '<div class="empty">주문을 불러오지 못했습니다.</div>';
    return;
  }
  var o = d.order;
  detailTitle(w, o);

  $('#detail').innerHTML =
    detailHead(o)
   +'<div class="sec"><h4>품목</h4><table><thead><tr><th class="l">품명</th><th style="width:56px">수량</th>'
     +'<th style="width:88px">단가</th><th style="width:96px">금액</th></tr></thead><tbody>'
     + (d.items||[]).map(function(i){
         return '<tr style="cursor:default"><td class="l">'
           +(i.link?'<a class="lnk2" href="'+esc(i.link)+'" target="_blank" rel="noopener">'+esc(i.name)+'</a>':esc(i.name))
           +(i.spec?'<br><small style="color:var(--mut)">'+esc(i.spec)+'</small>':'')+'</td>'
           +'<td>'+(i.qty||0)+'</td><td class="n">'+(i.unit_price?won(i.unit_price):'—')+'</td>'
           +'<td class="n">'+(i.amount?won(i.amount):'—')+'</td></tr>'; }).join('')
     +'</tbody></table>'
     +(o.total_amount?'<div class="sum"><span>합계 (VAT 포함)</span><span>'+won(o.total_amount)+'원</span></div>'
        :'<p class="hint" style="margin-top:10px">금액을 확인하는 중입니다.</p>')
   +'</div>'
   +((d.documents||[]).length
     ? '<div class="sec"><h4>문서</h4>'
       + d.documents.map(function(x){
           return '<div class="kv"><span>'+esc(DT[x.type]||x.type)+'</span><span>'+esc(x.doc_no||'')+' · '+esc(x.status)
             +(x.status==='취소됨'?'':' &nbsp;<a class="lnk" href="/doc/'+x.id+'" target="_blank">보기</a>'
               +'<a class="lnk" href="/doc/'+x.id+'?f=pdf" target="_blank">PDF</a>')+'</span></div>'; }).join('')
       +'</div>'
     : '')
   +'<div class="sec"><h4>진행 이력</h4>'
     +(d.events||[]).map(function(e){
        return '<div class="ev"><time>'+esc(String(e.created_at||'').slice(5,16))+'</time><div>'+esc(e.detail||e.action)+'</div></div>';
      }).join('')
   +'</div>';

  bindActions(id, o);
}

function actionBlock(o){
  if (o.status==='배송중'){
    return '<div class="actbox">발송되었습니다. 물건을 받으셨으면 눌러주세요.</div>'
      +(o.receive_note?'<div class="warnbox" style="margin-top:8px">미수령으로 알려주셨습니다 — '+esc(o.receive_note)+'<br>확인 후 연락드리겠습니다.</div>':'')
      +'<div class="twobtn"><button class="btn gray" id="nr">아직 못 받았어요</button>'
      +'<button class="btn ok" id="rc">받았습니다</button></div>';
  }
  if (o.status==='수령확인' && o.received_at){
    return '<div class="okbox" style="margin-top:16px">'+esc(String(o.received_at).slice(0,16))+' 수령 확인됨</div>';
  }
  return '';
}

function bindActions(id, o){
  var rc=$('#rc');
  if (rc) rc.onclick = async function(){
    if(!confirm('물건을 모두 받으셨습니까?')) return;
    rc.disabled=true; rc.textContent='처리 중…';
    var r = await fetch('/api/order/'+id,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({action:'received'})}).then(function(r){return r.json();});
    if(r.ok){ cache.orders=null; closeOrderModal(); cur=null; toast('수령 확인되었습니다'); viewOrders(); }
    else { alert(r.message||'실패'); rc.disabled=false; rc.textContent='받았습니다'; }
  };

  var nr=$('#nr');
  if (nr) nr.onclick = function(){
    var w = modal('아직 못 받으셨나요?',
       '<p class="hint">확인 후 바로 연락드리겠습니다. 상황을 적어주시면 빠릅니다.</p>'
      +'<label>내용 (선택)</label><input id="nr-note" placeholder="예) 3건 중 1건만 도착, 파손 등">'
      +'<div class="mrow"><button class="btn gray" data-x>닫기</button>'
        +'<button class="btn pri" id="nr-go">알리기</button></div>');
    $('#nr-go').onclick = async function(){
      var r = await fetch('/api/order/'+id,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({action:'not_received', note:$('#nr-note').value})}).then(function(r){return r.json();});
      w.remove();
      if(r.ok){ cache.orders=null; toast('전달되었습니다'); openOrder(id); } else alert(r.message||'실패');
    };
  };
}

/* ---------------- 계산서 발행 정보 ---------------- */
var BF = [['company','상호 (기관·회사명)',1],['biz_no','사업자등록번호',1],['ceo','대표자명',1],
          ['tax_email','계산서 수신 이메일',0],['address','주소',0],['biz_type','업태',0],['biz_item','종목',0]];

function billForm(orderId){
  var w = modal('세금계산서 발행 정보',
    '<p class="hint">사업자등록증에 적힌 그대로 입력해주세요. 한 번 등록하면 다음 주문에서 골라 쓸 수 있습니다.</p>'
    + BF.map(function(f){ return '<label class="'+(f[2]?'req':'')+'">'+f[1]+'</label><input id="b-'+f[0]+'"'
        +(f[0]==='tax_email'?' type="email" inputmode="email"':'')
        +(f[0]==='biz_no'?' inputmode="numeric" placeholder="000-00-00000"':'')+'>'; }).join('')
    +'<label class="chk"><input type="checkbox" id="b-def" checked> 앞으로 기본으로 사용</label>'
    +'<div class="mrow"><button class="btn gray" data-x>닫기</button><button class="btn ok" id="b-go">저장</button></div>');
  $('#b-go').onclick = async function(){
    var body={};
    for (var i=0;i<BF.length;i++){ body[BF[i][0]] = $('#b-'+BF[i][0]).value.trim(); }
    for (var j=0;j<BF.length;j++){ if (BF[j][2] && !body[BF[j][0]]) return alert(BF[j][1]+'을(를) 입력해주세요.'); }
    body.is_default = $('#b-def').checked;
    var btn=$('#b-go'); btn.disabled=true; btn.textContent='저장 중…';
    var r = await fetch('/api/order/profiles',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify(body)}).then(function(r){return r.json();});
    if (!r.ok){ btn.disabled=false; btn.textContent='저장'; return alert(r.message||'저장 실패'); }
    if (orderId) await fetch('/api/order/'+orderId,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({action:'bill', bill_profile_id:r.id})});
    w.remove();
    toast('등록되었습니다');
    cache.settle=null;
    if (orderId) openOrder(orderId); else viewSettle();
  };
}

/* ---------------- 주문하기 ---------------- */
function go(v){ view=v; cur=null; location.hash='#'+v; syncNav(); render(); }

// 크롬 확장 ID — 확인되면 여기만 채우면 된다. 비어 있으면 붙여넣기 폼으로 넘어간다.
var EXT_ID = '';

let sites=[], siteId=null;
// 메뉴를 누르면 곧바로 뼈대를 그리고, 데이터가 오면 채운다.
// 한 번 본 화면은 캐시에서 즉시 그린 뒤 뒤에서 조용히 갱신한다.
var cache = { orders:null, sites:null, settle:null };

async function viewNew(){
  if (cache.sites){ sites = cache.sites; pickSite(); paintNew(); }
  var sr = await fetch('/api/order/sites').then(function(r){return r.json();}).catch(function(){return {};});
  sites = sr.sites || [];
  cache.sites = sites;
  pickSite();
  paintNew();
}
function pickSite(){
  if (siteId!=null && sites.some(function(s){ return s.id===siteId; })) return;
  var d0 = sites.find(function(s){ return s.is_default; }) || sites[0];
  siteId = d0 ? d0.id : null;
}
function paintNew(){

  $('#main').innerHTML =
    '<div class="ttl">주문하기</div>'
   +'<div class="split2">'
     +'<div class="panel pad">'
       +'<div class="seg" id="seg">'
         +'<button data-m="one" class="on">단건 주문</button>'
         +'<button data-m="bulk">여러 건 주문</button>'
         +'<button data-m="recent">최근 주문</button>'
       +'</div>'
       +'<div id="inputArea"></div>'
     +'</div>'
     +'<div class="panel pad" id="cartPanel">'+cartBlock()+'</div>'
   +'</div>';

  $('#seg').onclick = function(e){
    var b=e.target.closest('button[data-m]'); if(!b) return;
    var m = b.dataset.m;
    document.querySelectorAll('#seg button').forEach(function(x){ x.classList.toggle('on', x.dataset.m===m); });
    if (m==='bulk') return openBulk();
    if (m==='recent') return recentTab();
    oneForm();
  };
  oneForm();
  bindCart();
}

/* --- 단건 입력 --- */
function oneForm(){
  $('#inputArea').innerHTML =
    '<div class="oneform">'
    +'<label class="req">품명 또는 모델명</label><input id="o-name" placeholder="2글자 이상 입력하면 검색됩니다" autocomplete="off">'
    +'<label>규격 · 옵션</label><input id="o-spec" placeholder="예) 500g, 1L, SH-FU-50TS">'
    +'<label class="req">상품 링크</label><input id="o-link" placeholder="https:// 로 시작하는 상품 페이지 주소" inputmode="url">'
    +'<label class="req">수량</label><input id="o-qty" type="number" inputmode="numeric" min="1" value="1">'
    +'<label>메모</label><input id="o-note" placeholder="색상·순도·납기 등 요청 (선택)">'
    +'<button class="btn pri" id="o-add" style="width:100%;margin-top:16px;padding:13px">담기</button>'
    +'</div>';
  var nm = $('#o-name');
  nm.oninput = function(){ suggestOne(nm.value); };
  nm.onblur = function(){ setTimeout(function(){ var g=document.querySelector('.oneform .sug'); if(g) g.remove(); },180); };
  nm.onkeydown = function(e){ if(e.key==='Enter'){ e.preventDefault(); $('#o-add').click(); } };
  $('#o-add').onclick = addOne;
  nm.focus();
}

var sTmr;
function suggestOne(q){
  clearTimeout(sTmr);
  var host = document.querySelector('.oneform');
  var old = host.querySelector('.sug'); if(old) old.remove();
  if (q.trim().length < 2) return;
  sTmr = setTimeout(async function(){
    var r = await fetch('/api/order/products?q='+encodeURIComponent(q.trim()))
      .then(function(r){return r.json();}).catch(function(){return {items:[]};});
    if (!r.items || !r.items.length) return;
    var g = document.createElement('div'); g.className='sug'; g.style.top='58px';
    g.innerHTML = r.items.map(function(p,i){
      var tag = p.src==='mine' ? '<span class="mine">이전 주문</span>' : '';
      var sub = p.src==='mine' ? (p.spec||'') : [p.brand,p.model,p.sobun].filter(Boolean).join(' · ');
      return '<div data-i="'+i+'"'+(p.src==='mine'?' class="mrow2"':'')+'><b>'+esc(p.name)+tag+'</b><small>'+esc(sub)+'</small></div>'; }).join('');
    host.appendChild(g);
    g.querySelectorAll('div[data-i]').forEach(function(d){
      d.onmousedown = function(){
        var p = r.items[Number(d.dataset.i)];
        $('#o-name').value = p.name;
        if (p.spec) $('#o-spec').value = p.spec;
        if (p.link) $('#o-link').value = p.link;
        g.remove(); $('#o-qty').focus();
      };
    });
  }, 250);
}

function addOne(){
  var name = $('#o-name').value.trim();
  if (!name){ $('#o-name').focus(); return toast('품명 또는 모델명을 입력해주세요'); }
  var link = $('#o-link').value.trim();
  if (!/^https?:\/\//i.test(link)){ $('#o-link').focus(); return toast('상품 링크를 넣어주세요 (https:// 로 시작)'); }
  var qty = Number($('#o-qty').value);
  if (!(qty > 0)){ $('#o-qty').focus(); return toast('수량을 입력해주세요'); }
  cart.push({ name:name, spec:$('#o-spec').value.trim(), link:link,
    qty: qty, note:$('#o-note').value.trim() });
  saveCart();
  ['o-name','o-spec','o-link','o-note'].forEach(function(id){ $('#'+id).value=''; });
  $('#o-qty').value=1; $('#o-name').focus();
  refreshCart(); toast('담았습니다 ('+cart.length+'건)');
}

/* --- 여러 건: 크롬 확장 --- */
// 확장이 보내오는 항목 형식: { name|title, option|spec, qty|quantity, url|link }
function normItems(list){
  return (list||[]).map(function(x){
    return { name: String(x.name||x.title||x.product||'').trim(),
             spec: String(x.option||x.options||x.spec||'').trim(),
             link: String(x.url||x.link||x.href||'').trim(),
             qty:  Math.max(1, Number(x.qty||x.quantity||1)||1), note:'' };
  }).filter(function(x){ return x.name; });
}

// 확장 content script → 페이지 (같은 window에서 postMessage)
window.addEventListener('message', function(e){
  if (e.source !== window) return;
  var d = e.data;
  if (!d || d.type !== 'rndsetup:items' || !Array.isArray(d.items)) return;
  receiveItems(normItems(d.items), d.site || '크롬 확장');
});

function receiveItems(rows, from){
  if (!rows.length) return toast('가져온 품목이 없습니다');
  if (view!=='new'){ go('new'); }
  var w = modal('가져온 품목 '+rows.length+'건',
     '<p class="hint">'+esc(from)+'에서 가져왔습니다. 확인 후 담아주세요.</p>'
    +'<table class="mini" style="margin-top:10px"><thead><tr><th class="l">품명</th><th>옵션</th>'
      +'<th style="width:52px">수량</th></tr></thead><tbody>'
    + rows.map(function(r){ return '<tr><td class="l">'+esc(r.name)
        +(r.link?'<br><small style="color:var(--mut)">'+esc(r.link.slice(0,52))+'…</small>':'')
        +'</td><td>'+esc(r.spec||'—')+'</td><td>'+r.qty+'</td></tr>'; }).join('')

function openBulk(){

  if (EXT_ID && window.chrome && chrome.runtime && chrome.runtime.sendMessage){
    var done = false;
    try {
      chrome.runtime.sendMessage(EXT_ID, { type:'rndsetup:pull' }, function(res){
        done = true;
        if (chrome.runtime.lastError) return bulkPaste(true);
        if (res && Array.isArray(res.items)) return receiveItems(normItems(res.items), res.site||'크롬 확장');
        bulkWait();     // 확장이 창을 띄우고 나중에 보내는 방식

function bulkWait(){

function bulkPaste(showNotice){
  $('#inputArea').innerHTML =
     (showNotice && !EXT_ID
       ? '<div class="warnbox" style="margin-top:14px">크롬 확장이 아직 연결되지 않았습니다. 아래에 붙여넣어 주문하실 수 있습니다.</div>'
       : '')
    +'<p class="hint" style="margin:14px 0 8px"><b>품명, 규격, 수량, 상품링크</b> 순서로 한 줄에 한 품목씩. '
    +'쉼표·탭으로 구분합니다. <b>상품 링크와 수량은 필수</b>입니다.</p>'
    +'<textarea id="b-text" style="min-height:170px;font-size:13.5px" placeholder="Potassium hydroxide, 500g, 2, https://shop.example.com/p/1&#10;Sodium aluminate, 1kg, 1, https://shop.example.com/p/2"></textarea>'
    +'<button class="btn gray" id="b-parse" style="width:100%;margin-top:12px;padding:13px">읽어들이기</button>'
    +'<div id="b-preview"></div>';
  $('#b-parse').onclick = parseBulk;
}

function parseBulk(){
  var raw = $('#b-text').value.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  if (!raw.length) return toast('내용을 붙여넣어 주세요');
  var rows = raw.map(function(line){
    var parts = line.split(/\t|,|\s{2,}/).map(function(p){ return p.trim(); });
    var link='', qty=1;
    for (var i=parts.length-1;i>=0;i--){ if(/^https?:\/\//i.test(parts[i])) link = parts.splice(i,1)[0]; }
    var last = parts[parts.length-1];
    if (parts.length>1 && last && /^\d+(\.\d+)?$/.test(last)) qty = Number(parts.pop());
    var name = parts.shift() || '';
    return { name:name, spec:parts.join(' ').trim(), link:link, qty:Math.max(1,qty), note:'' };
  }).filter(function(r){ return r.name; });

  var bad = rows.filter(function(r){ return !r.link; });
  $('#b-preview').innerHTML =
    '<div style="margin-top:14px"><h4 class="ph2">읽어들인 '+rows.length+'건</h4>'
    +(bad.length?'<div class="warnbox" style="margin-bottom:10px">상품 링크가 없는 줄이 '+bad.length+'건 있습니다. 링크를 넣어 다시 읽어들여 주세요.</div>':'')
    +'<table class="mini"><thead><tr><th class="l">품명</th><th>규격</th><th style="width:52px">수량</th><th style="width:52px">링크</th></tr></thead><tbody>'
    + rows.map(function(r){ return '<tr><td class="l">'+esc(r.name)+'</td><td>'+esc(r.spec||'—')+'</td><td>'+r.qty+'</td>'
        +'<td>'+(r.link?'✓':'<span style="color:#C2410C">없음</span>')+'</td></tr>'; }).join('')
    +'</tbody></table><button class="btn pri" id="b-add"'+(bad.length?' disabled':'')
    +' style="width:100%;margin-top:12px;padding:13px">'+rows.length+'건 담기</button></div>';
  $('#b-add').onclick = function(){
    cart = cart.concat(rows); saveCart();
    $('#b-text').value=''; $('#b-preview').innerHTML='';
    refreshCart(); toast(rows.length+'건 담았습니다');
  };
}

    b.onclick = function(){ cart.splice(Number(b.dataset.i),1); saveCart(); refreshCart(); }; });

    r.onchange = function(){ siteId = Number(r.value); refreshCart(); }; });

// 다음(카카오) 우편번호 서비스 — 열 때 한 번만 불러온다
function loadPostcode(cb){
  if (window.daum && window.daum.Postcode) return cb();
  var s = document.createElement('script');
  s.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
  s.onload = cb;
  s.onerror = function(){ toast('주소 검색을 불러오지 못했습니다'); };
  document.head.appendChild(s);
}

function siteForm(){

     '<label class="req">소속 (기관 · 연구실)</label>'
    +'<input id="s-org" placeholder="예) 부산대학교 재료공학과 000연구실">'

      +'<button class="btn gray" id="s-find">주소 검색</button></div>'
    +'<input id="s-post" type="hidden">'
    +'<input id="s-detail" placeholder="상세주소 (동·호수, 연구동 등)" style="margin-top:7px">'

  $('#s-find').onclick = function(){

    loadPostcode(function(){
      wrap.style.display = 'block';
      wrap.innerHTML = '';
      new daum.Postcode({
        width: '100%', height: '100%',
        oncomplete: function(data){
          var road = data.roadAddress || data.jibunAddress || '';
          var extra = '';
          if (data.bname && /[동|로|가]$/g.test(data.bname)) extra += data.bname;
          if (data.buildingName && data.apartment === 'Y') extra += (extra ? ', ' : '') + data.buildingName;
          if (extra) road += ' (' + extra + ')';
          $('#s-addr').value = road;
          $('#s-post').value = data.zonecode || '';
          wrap.style.display = 'none';
          $('#s-detail').focus();
        },
        onresize: function(size){ wrap.style.height = size.height + 'px'; }
      }).embed(wrap);
    });
  };

  $('#s-go').onclick = async function(){

    var btn = $('#s-go'); btn.disabled = true; btn.textContent = '저장 중…';

      body:JSON.stringify({ org_name:org, address:$('#s-addr').value.trim(),
        postcode:$('#s-post').value, address_detail:$('#s-detail').value.trim(),
        is_default:$('#s-def').checked })}).then(function(r){return r.json();});
    if (!r.ok){ btn.disabled=false; btn.textContent='저장'; return alert(r.message||'저장 실패'); }
    w.remove(); siteId = r.id; cache.sites=null;
    var m = await fetch('/api/auth/me').then(function(r){return r.json();}).catch(function(){return {};});
    if (m.lab){ lab = m.lab; lab.members = (m.members||[]).length; $('#whoOrg').textContent = lab.name; paintLab(); }

    if (view==='me') paintMe(); else if (view==='home') paintHome(); else viewNew();

async function submitOrder(){
  if (!cart.length) return toast('담은 품목이 없습니다');
  if (!sites.length) return toast('납품지를 먼저 추가해주세요');
  if (!siteId) return toast('납품지를 선택해주세요');
  if (!ordOk()){ toast('주문자 정보를 먼저 입력해주세요'); return ordererForm(); }
  var body = { items: cart, site_id: siteId, orderer: ord };
  var btn=$('#f-go'); btn.disabled=true; btn.textContent='보내는 중…';
  var r = await fetch('/api/order',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify(body)}).then(function(r){return r.json();});
  if (!r.ok){ btn.disabled=false; btn.textContent=cart.length+'건 주문 요청 보내기'; return alert(r.message||'전송에 실패했습니다.'); }

  toast(r.order_no+' 접수되었습니다');
  go('orders');
}

/* ---------------- 정산하기 ---------------- */
async function viewSettle(){
  if (cache.settle) paintSettle(cache.settle);
  var both = await Promise.all([
    fetch('/api/order/settlement').then(function(r){return r.json();}).catch(function(){return null;}),
    fetch('/api/order/settlements').then(function(r){return r.json();}).catch(function(){return {};})
  ]);
  var st = both[0];
  if (!st){ if(!cache.settle) paintSettle({}); return; }
  st.requests = (both[1] && both[1].settlements) || [];
  cache.settle = st;
  paintSettle(st);
}

function paintSettle(st){
  var ps = st.profiles||[], docs = st.documents||[], lg = st.ledger||[], reqs = st.requests||[];

  var h = '<div class="ttlrow"><div class="ttl" style="margin:0">정산하기</div>'
        + '<button class="btn pri" id="reqBtn">정산 요청</button></div>';

  // 잔여금 — 한 줄 바로 압축
  if (st.postpaid){
    h += '<div class="kbar">'
      + '<div><span>지출금</span><b>'+won(st.spent)+'</b></div>'
      + '<div><span>중간정산금</span><b>'+won(st.paid)+'</b></div>'
      + '<div class="hi"><span>정산금 잔여</span><b>'+won(st.due)+'</b></div>'
      + '</div>';
  }

  // 계산서 발행 정보 — 한 줄 요약 + 관리
  var bp = ps.find(function(p){ return p.is_default; }) || ps[0];
  h += '<div class="billbar">'
    + (bp
       ? '<div class="bb"><b>'+esc(bp.company)+'</b>'
         + '<span>'+esc(bp.biz_no||'—')+'</span><span>'+esc(bp.ceo||'—')+'</span>'
         + (ps.length>1?'<em>외 '+(ps.length-1)+'건</em>':'') + '</div>'
       : '<div class="bb none">세금계산서 발행 정보가 없습니다</div>')
    + '<button class="mini" id="billMng">'+(bp?'관리':'＋ 등록')+'</button></div>';

  // 정산 요청 — 이 화면의 본론
  h += reqCards(reqs);

  // 나머지는 접어둔다
  if (st.postpaid){
    h += fold('거래 내역', lg.length, lg.length
      ? '<table class="cards ledger"><thead><tr><th style="width:96px">일자</th><th>내용</th>'
        + '<th style="width:120px">금액</th><th style="width:130px">잔액</th></tr></thead><tbody>'
        + lg.map(function(r){
            var neg = r.amount < 0;
            return '<tr style="cursor:default"><td>'+esc(r.at)+'</td>'
              +'<td class="l"><b>'+esc(r.label)+'</b><br><small style="color:var(--mut)">'
                +esc(r.kind)+(r.ref?' · '+esc(r.ref):'')+'</small></td>'
              +'<td class="n" style="color:'+(neg?'#166534':'var(--ink)')+'">'
                +(neg?'−':'+')+won(Math.abs(r.amount))+'</td>'
              +'<td class="n"><b>'+won(r.balance)+'</b></td></tr>'; }).join('')
        + '</tbody></table>'
      : '<div class="empty">거래 내역이 없습니다.</div>');
  }

  h += fold('발급 서류', docs.length, docs.length
    ? '<table class="cards docs"><thead><tr><th style="width:110px">종류</th><th>문서번호</th>'
      + '<th style="width:96px">발행일</th><th style="width:96px">상태</th><th style="width:130px">받기</th></tr></thead><tbody>'
      + docs.map(function(d){
          return '<tr style="cursor:default"><td>'+esc(DT[d.type]||d.type)+'</td>'
            +'<td class="l"><b>'+esc(d.doc_no||'')+'</b><br><small style="color:var(--mut)">'+esc(d.title||d.order_no)+'</small></td>'
            +'<td>'+esc(d.issue_date||'')+'</td><td>'+badge(d.status)+'</td>'
            +'<td>'+(d.status==='취소됨'?'—':'<a class="lnk" href="/doc/'+d.id+'" target="_blank">보기</a>'
              +'<a class="lnk" href="/doc/'+d.id+'?f=pdf" target="_blank">PDF</a>')+'</td></tr>'; }).join('')
      + '</tbody></table>'
    : '<div class="empty">아직 발급된 서류가 없습니다.</div>');

  $('#main').innerHTML = h;
  $('#reqBtn').onclick = settleForm;
  $('#billMng').onclick = function(){ billManage(ps); };
}

function fold(title, n, inner){
  return '<details class="fold"><summary>'+esc(title)
    + (n?'<i>'+n+'</i>':'') + '</summary><div class="foldin">'+inner+'</div></details>';
}

// 계산서 발행 정보 관리 — 목록·추가·삭제를 모달 한 곳에서
function billManage(ps){
  var w = modal('세금계산서 발행 정보',
     '<div id="bm-list"></div>'
    +'<button class="btn ghost" id="bm-add" style="width:100%;margin-top:10px">＋ 발행 정보 등록</button>'
    +'<div class="mrow"><button class="btn gray" data-x>닫기</button></div>');
  paint();
  function paint(){
    $('#bm-list').innerHTML = ps.length
      ? ps.map(function(p){
          return '<div class="itrow" style="background:#fff">'
            +'<div class="kv"><span>상호명</span><span><b>'+esc(p.company||'—')+'</b>'
              +(p.is_default?' <span class="badge s2">기본</span>':'')+'</span></div>'
            +'<div class="kv"><span>사업자번호</span><span>'+esc(p.biz_no||'—')+'</span></div>'
            +'<div class="kv"><span>대표자명</span><span>'+esc(p.ceo||'—')+'</span></div>'
            +(p.tax_email?'<div class="kv"><span>계산서 메일</span><span>'+esc(p.tax_email)+'</span></div>':'')
            +'<button class="lnk" data-del="'+p.id+'" style="margin-top:6px;color:#991B1B">삭제</button></div>'; }).join('')
      : '<div class="warnbox">등록된 발행 정보가 없습니다. 세금계산서 발행에 필요합니다.</div>';
    $('#bm-list').querySelectorAll('[data-del]').forEach(function(b){
      b.onclick = async function(){
        if (!confirm('이 발행 정보를 삭제할까요?')) return;
        await fetch('/api/order/profiles?id='+b.dataset.del,{method:'DELETE'});
        ps = ps.filter(function(x){ return String(x.id)!==b.dataset.del; });
        cache.settle=null; paint(); toast('삭제되었습니다');
      };
    });
  }
  $('#bm-add').onclick = function(){ w.remove(); billForm(null); };
}

/* ---------------- 정산 요청 ---------------- */
var SQ = { '정산요청':'q0', '처리중':'q1', '서류발급 완료':'q2', '입금완료':'q3', '반려':'q4' };

function reqCards(rows){
  var h = '<div class="dt2" style="font-size:15px;margin:2px 0 12px">정산 요청 내역</div>';
  if (!rows.length){
    return h + '<div class="panel"><div class="empty">아직 정산 요청이 없습니다.<br>'
      + '위 <b>정산 요청</b> 버튼으로 요청하시면 서류를 발급해 드립니다.</div></div>'
      + '<div style="height:18px"></div>';
  }
  h += '<div class="scards">' + rows.map(function(r){
    var items = r.items || [];
    var title = items.length ? (items[0].name + (items.length>1 ? ' 외 '+(items.length-1)+'건' : '')) : '(항목 없음)';
    var docs = ['견적서 '+shortD(r.quote_date), '거래명세서 '+shortD(r.statement_date)];
    if (r.taxinvoice_date) docs.push('세금계산서 '+shortD(r.taxinvoice_date));
    var done = r.status==='입금완료';
    return '<div class="scard'+(done?' done':'')+(r.status==='반려'?' rej':'')+'">'
      + (done ? '<div class="stamp2"><b>정산완료</b><small>'+esc(String(r.done_at||'').slice(0,10))+'</small></div>' : '')
      + '<div class="sc1"><span class="badge '+(SQ[r.status]||'q0')+'">'+esc(r.status)+'</span>'
        + '<span class="sdate">'+esc(String(r.created_at||'').slice(0,10))+'</span></div>'
      + '<div class="sc2">'+esc(title)+'</div>'
      + '<div class="sc3">'+won(r.total)+'<small>원 · 부가세 포함</small></div>'
      + '<div class="sc4"><span class="pill">'+esc(r.method==='카드'?'카드':'통장입금')+'</span>'
        + docs.map(function(d){ return '<span>'+esc(d)+'</span>'; }).join('') + '</div>'
      + (r.memo?'<div class="sc5">'+esc(r.memo)+'</div>':'')
      + '</div>';
  }).join('') + '</div><div style="height:18px"></div>';
  return h;
}
function shortD(d){ return d ? String(d).slice(5).replace('-','/') : '—'; }

var sItems = [];
function settleForm(){
  sItems = [{ name:'', qty:1, price:0 }];
  var method = '통장';
  var w = modal('정산 요청',
     '<div class="lbrow"><label class="req" style="margin:0">항목</label>'
       +'<button class="mini" id="q-add">＋ 항목 추가</button></div>'
    +'<div id="q-items"></div>'
    +'<div class="qsum" id="q-sum"></div>'
    +'<label class="req">결제 방식</label>'
    +'<div class="seg2" id="q-method"><button data-v="통장" class="on">통장입금</button>'
      +'<button data-v="카드">카드</button></div>'
    +'<label class="req">필요 서류 <span class="hint" style="font-weight:600">(날짜 필수 입력)</span></label>'
    +'<div class="docbox"><span>견적서</span><input id="q-d1" type="date"></div>'
    +'<div class="docbox"><span>거래명세서</span><input id="q-d2" type="date"></div>'
    +'<div class="docbox" id="q-d3box"><span>세금계산서</span><input id="q-d3" type="date"></div>'
    +'<label class="req">회신받을 이메일</label><input id="q-email" type="email" inputmode="email" placeholder="name@company.co.kr" value="'+esc(ord.email||me.email||'')+'">'
    +'<p class="hint" style="margin-top:6px">서류가 이 주소로 갑니다. 업무용 메일로 바꿔 적으셔도 됩니다.</p>'
    +'<label>메모</label><textarea id="q-memo" placeholder="메모를 입력하세요 (선택)"></textarea>'
    +'<button class="btn pri" id="q-go" style="width:100%;margin-top:18px;padding:15px;font-size:15.5px">정산 요청</button>');

  $('#q-add').onclick = function(){ sItems.push({name:'',qty:1,price:0}); paintQItems(); };
  $('#q-method').onclick = function(e){
    var b = e.target.closest('button[data-v]'); if(!b) return;
    method = b.dataset.v;
    document.querySelectorAll('#q-method button').forEach(function(x){ x.classList.toggle('on', x.dataset.v===method); });
    // 카드결제는 매출전표로 갈음하므로 세금계산서를 받지 않는다
    $('#q-d3box').style.display = method==='카드' ? 'none' : 'flex';
  };
  $('#q-go').onclick = async function(){
    var items = sItems.filter(function(i){ return (i.name||'').trim(); });
    if (!items.length) return alert('항목을 1개 이상 입력해주세요.');
    if (!$('#q-d1').value || !$('#q-d2').value || (method!=='카드' && !$('#q-d3').value))
      return alert('필요 서류의 날짜를 모두 입력해주세요.');
    var email = $('#q-email').value.trim();
    if (!email) return alert('회신받을 이메일을 입력해주세요.');
    var btn=$('#q-go'); btn.disabled=true; btn.textContent='요청 중…';
    var r = await fetch('/api/order/settlements',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({ items:items, method:method, reply_email:email,
        quote_date:$('#q-d1').value, statement_date:$('#q-d2').value, taxinvoice_date:$('#q-d3').value,
        memo:$('#q-memo').value })}).then(function(r){return r.json();});
    if (!r.ok){ btn.disabled=false; btn.textContent='정산 요청'; return alert(r.message||'요청 실패'); }
    w.remove(); cache.settle=null; toast('정산 요청이 접수되었습니다'); viewSettle();
  };
  paintQItems();
}

function paintQItems(){
  $('#q-items').innerHTML = sItems.map(function(it,i){
    return '<div class="qrow" data-i="'+i+'">'
      +'<input class="qn" placeholder="항목명" value="'+esc(it.name)+'">'
      +'<div class="q3"><div><label>수량</label><input class="qq" type="number" min="1" value="'+it.qty+'"></div>'
        +'<div><label>단가(원)</label><input class="qp" type="number" inputmode="numeric" value="'+it.price+'"></div>'
        +'<div><label>소계(원)</label><input class="qs" value="'+won(it.qty*it.price)+'" readonly></div></div>'
      +(sItems.length>1?'<button class="qx" data-i="'+i+'">×</button>':'')
      +'</div>';
  }).join('');
  $('#q-items').querySelectorAll('.qrow').forEach(function(el){
    var i = Number(el.dataset.i);
    el.querySelector('.qn').oninput = function(e){ sItems[i].name = e.target.value; };
    el.querySelector('.qq').oninput = function(e){ sItems[i].qty = Math.max(1,Number(e.target.value)||1); qsum(el,i); };
    el.querySelector('.qp').oninput = function(e){ sItems[i].price = Number(e.target.value)||0; qsum(el,i); };
    var x = el.querySelector('.qx'); if (x) x.onclick=function(){ sItems.splice(i,1); paintQItems(); };
  });
  qtotal();
}
function qsum(el,i){ el.querySelector('.qs').value = won(sItems[i].qty*sItems[i].price); qtotal(); }
function qtotal(){
  var sup = sItems.reduce(function(a,i){ return a + i.qty*i.price; },0);
  var vat = Math.round(sup*0.1);
  $('#q-sum').innerHTML = '<div><span>합계</span><b>'+won(sup)+'원</b></div>'
    +'<div><span>부가세 (10%)</span><b>'+won(vat)+'원</b></div>'
    +'<div class="tt"><span>총계</span><b>'+won(sup+vat)+'원</b></div>';
}

/* ---------------- 모달 헬퍼 ---------------- */
function modal(title, inner){
  var w = document.createElement('div');
  w.className='modal';
  w.innerHTML = '<div class="mbox"><button class="x" data-x>×</button><h3>'+esc(title)+'</h3>'+inner+'</div>';
  document.body.appendChild(w);
  w.addEventListener('click', function(e){
    if (e.target===w || e.target.hasAttribute('data-x')) w.remove();
  });
  return w;
}

window.addEventListener('hashchange', function(){
  var v = location.hash.replace('#','') || 'home';
  if (v!==view && VIEWS.indexOf(v)>=0){ view=v; cur=null; syncNav(); render(); }
});
boot();
</script>
