<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a2540">
<title>내 주문 — 실험셋업연구소</title>
<link rel="canonical" href="https://rndsetup.com/order/my/">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0a2540;--teal:#1a6e56;--ink:#1a2332;--mut:#5a6779;--line:#e3e8ef;--bg:#f4f6fa}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;word-break:keep-all;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.top{background:var(--navy);color:#fff;padding:calc(13px + env(safe-area-inset-top)) 16px 13px}
.top h1{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.top h1 a{margin-left:auto;color:#9fc3e8;text-decoration:none;font-size:12.5px;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:10px;cursor:pointer}
.r1{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.no{font-size:12px;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.st{margin-left:auto;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#eef2f7;color:var(--mut)}
.st.s0{background:#FEF3C7;color:#92400E}.st.s1{background:#DBEAFE;color:#1E40AF}.st.s2{background:#D1FAE5;color:#065F46}
.st.s3{background:#E0E7FF;color:#3730A3}.st.s4{background:#F3E8FF;color:#6B21A8}.st.s5{background:#CFFAFE;color:#155E75}
.st.s6{background:#DCFCE7;color:#166534}.st.s7{background:#F1F5F9;color:#475569}.st.s8{background:#FEE2E2;color:#991B1B}
.ttl{font-size:15px;font-weight:700}
.sub{font-size:12.5px;color:var(--mut);margin-top:4px}
.amt{margin-top:7px;font-size:15px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.sec{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:11px}
.sec h2{font-size:13px;font-weight:800;color:var(--mut);margin-bottom:11px}
.kv{display:flex;gap:10px;font-size:13.5px;padding:4px 0}
.kv span:first-child{color:var(--mut);flex:0 0 80px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;color:var(--mut);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-size:16px;font-weight:800;color:var(--navy);padding-top:11px;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:15.5px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}
.btn.pri{background:var(--teal);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--mut)}
.btn.kakao{background:#FEE500;color:#191600}
.ev{font-size:12.5px;padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:9px}
.ev:last-child{border-bottom:0}
.ev time{flex:0 0 88px;color:var(--mut);font-variant-numeric:tabular-nums}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:11px 0 5px}
input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;background:#fbfcfe}
.req::after{content:' *';color:#C2410C}
.warnbox{font-size:13px;color:#92400E;background:#FEF3C7;border-radius:9px;padding:10px 12px;line-height:1.5}
.okbox{font-size:13px;color:#065F46;background:#D1FAE5;border-radius:9px;padding:10px 12px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,37,64,.5);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
.mbox{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.mbox h4{font-size:16px;font-weight:800;margin-bottom:4px}
.mrow{display:flex;gap:8px;margin-top:16px}
.mrow button{flex:1;border:0;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
.mrow .mghost{background:#eef2f7;color:var(--mut)}
.mrow .mgo{background:var(--teal);color:#fff}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--mut)}
.chk input{width:18px;height:18px;flex:0 0 18px}
@media(min-width:820px){.modal{align-items:center}.mbox{border-radius:16px}}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:44px 20px}
.foot{text-align:center;font-size:12px;color:var(--mut);padding:18px 12px 30px;line-height:1.7}
</style>
</head>
<body>
<div class="top"><h1 id="hd">내 주문<a href="/order/">+ 새 주문</a></h1></div>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<div class="foot">이머전트 · 070-8983-2600 · info@rndsetup.com</div>

<script>
const app = document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Number(n||0).toLocaleString('ko-KR');
const STATUSES = ['요청접수','견적발송','견적승인','발주확정','납품완료','계산서발행','완료','보류','취소'];
const SIDX = {}; STATUSES.forEach((s,i)=>SIDX[s]=i);
const DT = {quote:'견적서',statement:'거래명세서',taxinvoice:'세금계산서'};

async function boot(){
  const r = await fetch('/api/auth/me').then(r=>r.json());
  if (!r.login){
    app.innerHTML = '<div class="sec"><h2>로그인</h2><p style="font-size:14px;margin-bottom:14px">주문 내역을 보려면 카카오톡으로 로그인해주세요.</p>'
      +'<a class="btn kakao" href="/api/auth/kakao?next=/order/my/">카카오톡으로 시작하기</a></div>';
    return;
  }
  const id = new URLSearchParams(location.search).get('id');
  if (id) return detail(id);
  list();
}

async function list(){
  const r = await fetch('/api/order').then(r=>r.json());
  if (!r.orders || !r.orders.length){
    app.innerHTML = '<div class="empty">아직 주문이 없습니다.</div><a class="btn pri" href="/order/">주문 요청하기</a>';
    return;
  }
  app.innerHTML = r.orders.map(o=>
    '<div class="card" data-id="'+o.id+'">'
    +'<div class="r1"><span class="no">'+esc(o.order_no)+'</span><span class="st s'+(SIDX[o.status]??7)+'">'+esc(o.status)+'</span></div>'
    +'<div class="ttl">'+esc(o.title||'(제목 없음)')+'</div>'
    +'<div class="sub">'+esc(String(o.created_at||'').slice(0,10))+(o.want_date?' · 희망납기 '+esc(o.want_date):'')+'</div>'
    +(o.total_amount?'<div class="amt">'+won(o.total_amount)+'원</div>':'<div class="sub">견적 준비 중</div>')
    +'</div>').join('');
  app.querySelectorAll('.card').forEach(c=>c.onclick=()=>{ history.pushState({},'','?id='+c.dataset.id); detail(c.dataset.id); });
}

async function detail(id){
  const d = await fetch('/api/order/'+id).then(r=>r.json());
  if (d.error){ app.innerHTML='<div class="empty">주문을 찾을 수 없습니다.</div>'; return; }
  const o = d.order;
  const rows = (d.items||[]).map(i=>
    '<tr><td>'+esc(i.name)+(i.spec?'<br><small style="color:var(--mut)">'+esc(i.spec)+'</small>':'')+'</td>'
    +'<td class="n">'+(i.qty||0)+' '+esc(i.unit||'')+'</td>'
    +'<td class="n">'+(i.unit_price?won(i.unit_price):'-')+'</td>'
    +'<td class="n">'+(i.amount?won(i.amount):'-')+'</td></tr>').join('');

  app.innerHTML =
   '<div class="sec"><div class="r1"><span class="no">'+esc(o.order_no)+'</span><span class="st s'+(SIDX[o.status]??7)+'">'+esc(o.status)+'</span></div>'
   +'<div class="ttl" style="margin:6px 0 10px">'+esc(o.title||'')+'</div>'
   +'<div class="kv"><span>요청일</span><span>'+esc(String(o.created_at||'').slice(0,16))+'</span></div>'
   +'<div class="kv"><span>희망납기</span><span>'+esc(o.want_date||'-')+'</span></div>'
   +'<div class="kv"><span>납품지</span><span>'+esc(o.ship_address||'-')+'</span></div>'
   +(o.request_note?'<div class="kv"><span>요청사항</span><span>'+esc(o.request_note)+'</span></div>':'')
   +'</div>'
   +'<div class="sec"><h2>품목</h2><table><thead><tr><th>품명</th><th class="n">수량</th><th class="n">단가</th><th class="n">금액</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +(o.total_amount?'<div class="tot"><span>합계 (VAT 포함)</span><span>'+won(o.total_amount)+'원</span></div>':'<p style="font-size:13px;color:var(--mut);margin-top:10px">단가는 견적서 발송 시 확정됩니다.</p>')
   +'</div>'
   +'<div class="sec"><h2>세금계산서 발행 정보</h2><div id="billBox">'+billBlock(d)+'</div></div>'
   +'<div class="sec"><h2>문서</h2>'
     +((d.documents||[]).length
        ? d.documents.map(x=>'<div class="kv"><span>'+esc(DT[x.type]||x.type)+'</span><span>'+esc(x.doc_no||'')+' · '+esc(x.status)+(x.status==='취소됨'?'':' · <a href="/doc/'+x.id+'" target="_blank">보기</a> · <a href="/doc/'+x.id+'?f=pdf" target="_blank">PDF</a>')+'</span></div>').join('')
        : '<div style="font-size:13px;color:var(--mut)">발행된 문서가 없습니다.</div>')
   +'</div>'
   +(o.status==='견적발송' ? '<button class="btn pri" id="ap">견적 승인하기</button><div style="height:9px"></div>' : '')
   +'<div class="sec"><h2>진행 이력</h2>'
     +(d.events||[]).map(e=>'<div class="ev"><time>'+esc(String(e.created_at||'').slice(5,16))+'</time><div>'+esc(e.detail||e.action)+'</div></div>').join('')
   +'</div>'
   +'<button class="btn ghost" id="back">← 목록으로</button>';

  document.getElementById('back').onclick = ()=>{ history.pushState({},'','/order/my/'); list(); };
  const ap = document.getElementById('ap');
  if (ap) ap.onclick = async ()=>{
    if (!confirm('견적 내용대로 승인하시겠습니까?')) return;
    ap.disabled = true; ap.textContent = '처리 중…';
    const r = await fetch('/api/order/'+id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'approve'})}).then(r=>r.json());
    if (r.ok) detail(id); else { alert(r.message||'실패'); ap.disabled=false; ap.textContent='견적 승인하기'; }
  };
  bindBill(id);
  window.scrollTo(0,0);
}

function billBlock(d){
  const b = d.bill, ps = d.profiles||[];
  let h = '';
  if (b) h += '<div class="okbox">이 주문은 <b>'+esc(b.company)+'</b>'+(b.biz_no?' ('+esc(b.biz_no)+')':'')+' 명의로 발행됩니다.</div>';
  else h += '<div class="warnbox">세금계산서 발행 정보가 아직 없습니다.<br>정산이 필요하시면 아래에서 등록해주세요. 등록 전까지 견적서는 소속 기관명으로 나갑니다.</div>';
  if (ps.length) h += '<label>발행 정보 선택</label><select id="billSel"><option value="">— 지정 안 함 —</option>'
    + ps.map(function(p){ return '<option value="'+p.id+'"'+((b&&b.id===p.id)?' selected':'')+'>'
        +esc(p.label||p.company)+(p.biz_no?' · '+esc(p.biz_no):'')+'</option>'; }).join('') + '</select>';
  h += '<div style="height:10px"></div><button class="btn ghost" id="addBill">＋ 발행 정보 등록</button>';
  return h;
}

function bindBill(id){
  const sel = document.getElementById('billSel');
  if (sel) sel.onchange = async function(){
    const r = await fetch('/api/order/'+id,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({action:'bill', bill_profile_id: sel.value? Number(sel.value):null})}).then(function(r){return r.json();});
    if (r.ok) detail(id); else alert(r.message||'실패했습니다.');
  };
  const add = document.getElementById('addBill');
  if (add) add.onclick = function(){ billForm(id); };
}

const BF = [['company','상호 (기관·회사명)',1],['biz_no','사업자등록번호',1],['ceo','대표자명',1],
            ['tax_email','계산서 수신 이메일',0],['address','주소',0],['biz_type','업태',0],['biz_item','종목',0]];

function billForm(orderId){
  const wrap = document.createElement('div');
  wrap.className='modal';
  wrap.innerHTML = '<div class="mbox"><h4>세금계산서 발행 정보</h4>'
    +'<p style="font-size:12.5px;color:var(--mut);margin-bottom:6px">사업자등록증에 적힌 그대로 입력해주세요. 한 번 등록하면 다음 주문에서 골라 쓸 수 있습니다.</p>'
    + BF.map(function(f){ return '<label class="'+(f[2]?'req':'')+'">'+f[1]+'</label><input id="b-'+f[0]+'"'
        +(f[0]==='tax_email'?' type="email" inputmode="email"':'')
        +(f[0]==='biz_no'?' inputmode="numeric" placeholder="000-00-00000"':'')+'>'; }).join('')
    +'<label class="chk"><input type="checkbox" id="b-def" checked> 앞으로 기본으로 사용</label>'
    +'<div class="mrow"><button class="mghost" id="b-x">닫기</button><button class="mgo" id="b-go">저장</button></div></div>';
  document.body.appendChild(wrap);
  document.getElementById('b-x').onclick=function(){ wrap.remove(); };
  wrap.onclick=function(e){ if(e.target===wrap) wrap.remove(); };
  document.getElementById('b-go').onclick=async function(){
    const body={};
    for (const f of BF) body[f[0]] = document.getElementById('b-'+f[0]).value.trim();
    for (const f of BF) if (f[2] && !body[f[0]]) return alert(f[1]+'을(를) 입력해주세요.');
    body.is_default = document.getElementById('b-def').checked;
    const btn=document.getElementById('b-go'); btn.disabled=true; btn.textContent='저장 중…';
    const r = await fetch('/api/order/profiles',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify(body)}).then(function(r){return r.json();});
    if (!r.ok){ btn.disabled=false; btn.textContent='저장'; return alert(r.message||'저장에 실패했습니다.'); }
    await fetch('/api/order/'+orderId,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({action:'bill', bill_profile_id: r.id})});
    wrap.remove(); detail(orderId);
  };
}

window.onpopstate = boot;
boot();
</script>
</body>
</html>
