<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alicat 질량유량계(MFC) 가상 시뮬레이터 — SCCM 유량 설정·가스 변경 따라하기 | 실험셋업연구소</title>
<meta name="description" content="Alicat MFC를 실제처럼 눌러보는 가상 시뮬레이터. 위저드에서 SCCM 유량 설정·가스 변경·단위 전환을 고르면 한 단계씩 따라할 수 있습니다.">
<link rel="canonical" href="https://rndsetup.com/alicat/mfc-guide/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<meta property="og:type" content="article">
<meta property="og:title" content="Alicat 질량유량계(MFC) 가상 시뮬레이터">
<meta property="og:description" content="위저드로 SCCM 유량 설정·가스 변경을 한 단계씩 따라하는 Alicat MFC 가상 컨트롤러.">
<meta property="og:url" content="https://rndsetup.com/alicat/mfc-guide/">
<style>
  :root{--ink:#1B1A18;--gray:#6B6560;--line:#E7E3DE;--ember:#C2410C;--ember-2:#9A3412;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--serif:"Noto Serif KR",Georgia,serif;--mono:"Share Tech Mono","Consolas",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:#fff;color:var(--ink);line-height:1.7;word-break:keep-all}
  a{color:inherit}
  .wrap{max-width:820px;margin:0 auto;padding:0 22px}
  .agp{padding:18px 0 34px}
  #pgtitle{font-family:var(--serif);font-size:clamp(20px,4.6vw,26px);font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
  #pgsub{font-size:14px;color:var(--gray);margin-bottom:16px}
  .simrow{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .sim{flex:0 0 340px;max-width:340px}
  .device{background:#0e1114;border-radius:18px;padding:14px 13px 16px}
  .brow{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;padding:0 3px}
  .abtn{height:37px;border-radius:8px;border:2px solid #f1f3f5;background:#171b21;cursor:pointer;transition:.1s;position:relative}
  .abtn:hover{background:#222932;border-color:#8fbcff}
  .abtn:active{transform:translateY(1px)}
  .abtn .num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;background:#e23a2e;color:#fff;font:400 11px/17px var(--sans);text-align:center}
  .abtn.wz{border-color:#e23a2e;box-shadow:0 0 0 3px rgba(226,58,46,.35);animation:wzp 1.1s infinite}
  @keyframes wzp{50%{box-shadow:0 0 0 6px rgba(226,58,46,.12)}}
  .lcd{background:#f7f8f2;border-radius:6px;margin:12px 2px;padding:12px 14px 13px;color:#141915;min-height:206px;font-family:var(--mono);display:flex;flex-direction:column}
  .skrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .skc{font-size:12px;line-height:1.15;min-height:30px}
  .skc.l{text-align:left}.skc.c{text-align:center}.skc.r{text-align:right}
  .skc .a{font-size:12.5px;color:#2b322c}.skc .b{font-size:15px;color:#0c110d;letter-spacing:.5px}
  .skc.act{cursor:pointer}.skc.act .b,.skc.act .solo{color:#0a3fb0}
  .skc .solo{font-size:14px;letter-spacing:.5px}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2px 0}
  .flow{display:flex;align-items:center;justify-content:space-between}
  .big{font-size:48px;line-height:.9;letter-spacing:1px;color:#0b0f0c}
  .ug{text-align:right;line-height:1.12}.ug .u{font-size:18px;letter-spacing:.5px}.ug .g{font-size:15px}
  .mflab{text-align:center;font-size:13px;letter-spacing:1px;color:#2b322c;margin-top:2px}
  .mtitle{text-align:center;font-size:19px;letter-spacing:.5px;color:#0a3fb0;margin:6px 0 8px}
  .li{font-size:14px;padding:2px 6px;letter-spacing:.5px}.li.sel{background:#0a3fb0;color:#fff;border-radius:3px}
  .setv{font-size:44px;text-align:center;letter-spacing:1px;color:#0b0f0c;margin:6px 0}
  .note{text-align:center;font-size:12px;color:#5a635b}
  /* 위저드 */
  .wiz{flex:1;min-width:250px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
  .wiz h2{font-family:var(--serif);font-size:15px;margin-bottom:10px}
  .wtask{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;margin-bottom:8px;font-family:inherit;color:var(--ink)}
  .wtask:hover{border-color:var(--ember)}
  .wtask.on{background:var(--ember);color:#fff;border-color:var(--ember)}
  .wtask small{display:block;font-weight:400;font-size:11.5px;color:var(--gray);margin-top:2px}
  .wtask.on small{color:#f6ddcf}
  .wprog{display:flex;gap:5px;margin:2px 0 12px}
  .wdot{flex:1;height:4px;border-radius:2px;background:var(--line)}.wdot.on{background:var(--ember)}.wdot.cur{background:var(--ember-2)}
  .wstep{display:flex;gap:11px;align-items:flex-start;background:#FBF2EC;border:1px solid #f0dccd;border-radius:10px;padding:12px 13px}
  .wstep .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--ember);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .wstep .tx{font-size:14px;color:#3a2a20}.wstep .tx b{color:var(--ember-2)}
  .wdone{background:#eef6f0;border:1px solid #cfe3d5;border-radius:10px;padding:12px 13px;font-size:14px;color:#1c5137}
  .wact{margin-top:10px;display:flex;gap:8px}
  .wbtn{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:#fff;cursor:pointer;color:var(--ember-2);font-family:inherit}
  .wbtn:hover{border-color:var(--ember)}
  .whint{font-size:12px;color:var(--gray);margin-top:10px}
  .foot{margin:22px 0 0;border-top:1px solid var(--line);padding-top:14px;font-size:13.5px;color:var(--gray)}
  .foot a{color:var(--ember-2);font-weight:700;text-decoration:none}
  @media(max-width:640px){.sim{flex:1 1 100%;max-width:340px;margin:0 auto}.wiz{flex:1 1 100%}}
</style>
<link rel="stylesheet" href="/assets/site.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"홈","item":"https://rndsetup.com/"},{"@type":"ListItem","position":2,"name":"Alicat MFC","item":"https://rndsetup.com/alicat/"},{"@type":"ListItem","position":3,"name":"메뉴얼","item":"https://rndsetup.com/alicat/manual/"},{"@type":"ListItem","position":4,"name":"가상 시뮬레이터","item":"https://rndsetup.com/alicat/mfc-guide/"}]}</script>
</head>
<body>
<div id="pumplab-header"></div>
<div class="agp">
  <div class="wrap">
    <h1 id="pgtitle">Alicat MFC 가상 시뮬레이터</h1>
    <p id="pgsub">오른쪽에서 할 일을 고르면 한 단계씩 따라할 수 있어요. 기본 단위 SCCM.</p>
    <div class="simrow">
      <div class="sim">
        <div class="device">
          <div class="brow" id="btop"></div>
          <div class="lcd" id="lcd"></div>
          <div class="brow" id="bbot"></div>
        </div>
      </div>
      <div class="wiz" id="wiz"></div>
    </div>
    <div class="foot">← <a href="/alicat/manual/">Alicat MFC 메뉴얼</a> · <a href="/alicat/">제품 보기</a></div>
  </div>
</div>
<div id="pumplab-footer"></div>
<script src="/assets/site.js" defer></script>
<script>
(function(){
  var GASES=["Air","N2","Ar","H2","He","CO2","CH4","CO"],UNITS=["SLPM","SCCM"],CATS=["Standard","Recent","COMPOSER Mixes","Bioreactor","Breathing","Chromatography","Fuel","Laser"];
  var S={mode:"run",unit:"SCCM",gas:"Air",setpt:0,val:0,edit:0,gi:0,ui:0,ci:0,msg:""};
  var lcd=document.getElementById('lcd'),bt=document.getElementById('btop'),bb=document.getElementById('bbot'),wizEl=document.getElementById('wiz');
  function conv(v){return S.unit==="SCCM"?v*1000:v;}
  function fmt(v){return S.unit==="SCCM"?Math.round(conv(v)).toString():conv(v).toFixed(1);}
  function sub(g){return g.replace(/(\d+)/g,'<sub style="font-size:.7em">$1<\/sub>');}
  function meas(a,b,al){return {a:a,b:b,align:al};}
  function key(solo,f,act,al){return {solo:solo,f:f,act:act,align:al};}
  function key2(a,b,f,al){return {a:a,b:b,f:f,act:1,align:al};}
  function bl(al){return {align:al};}
  function sk(){switch(S.mode){
    case "run":return {top:[meas("PSIA","+13.49","l"),meas("&deg;C","+22.73","c"),key2("SETPT","+"+fmt(S.setpt),enterSet,"r")],bot:[meas("+16.67","LPM","l"),meas("+"+fmt(S.val),S.unit,"c"),key("MENU",enterMenu,1,"r")]};
    case "set":return {top:[key("CANCEL",toRun,0,"l"),key("-10",function(){chg(-10)},0,"c"),key("+10",function(){chg(10)},0,"r")],bot:[key("−",function(){chg(-1)},0,"l"),key("＋",function(){chg(1)},0,"c"),key("SET",doSet,1,"r")]};
    case "menu":return {top:[key("CONTROL",function(){info('Control (p.23)')},0,"l"),key("ABOUT",function(){info('About (p.32)')},0,"c"),key("TARES",function(){info('Tares (p.22)')},0,"r")],bot:[key("BASIC CFG",enterCfg,1,"l"),key("ADV SETUP",function(){info('Adv Setup')},0,"c"),key("MAIN",toRun,0,"r")]};
    case "cfg":return {top:[key("BACK",enterMenu,0,"l"),bl("c"),key("MAIN",toRun,0,"r")],bot:[key("GAS",enterGas,1,"l"),key("UNITS",enterUnits,0,"c"),key("STP/NTP",function(){info('STP / NTP')},0,"r")]};
    case "gascat":return {top:[key("BACK",enterCfg,0,"l"),bl("c"),key("MAIN",toRun,0,"r")],bot:[key("▼",function(){mv('ci',CATS,1)},0,"l"),key("▲",function(){mv('ci',CATS,-1)},0,"c"),key("SELECT",openCat,1,"r")]};
    case "gas":return {top:[key("CANCEL",enterGas,0,"l"),bl("c"),key("MAIN",toRun,0,"r")],bot:[key("▼",function(){mv('gi',GASES,1)},0,"l"),key("▲",function(){mv('gi',GASES,-1)},0,"c"),key("SET",pickGas,1,"r")]};
    case "units":return {top:[key("BACK",enterCfg,0,"l"),bl("c"),key("MAIN",toRun,0,"r")],bot:[key("▼",function(){mv('ui',UNITS,1)},0,"l"),key("▲",function(){mv('ui',UNITS,-1)},0,"c"),key("SET",pickUnit,1,"r")]};
    case "info":return {top:[key("BACK",enterMenu,0,"l"),bl("c"),key("MAIN",toRun,0,"r")],bot:[bl("l"),bl("c"),bl("r")]};}
  }
  function cellHtml(c){var cls="skc "+(c.align||"c")+(c.f?" act":"");var inner=(c.a!==undefined)?'<div class="a">'+(c.a||"")+'</div><div class="b">'+(c.b||"")+'</div>':(c.solo!==undefined?'<div class="solo">'+c.solo+'</div>':'&nbsp;');return '<div class="'+cls+'">'+inner+'</div>';}
  function renderBtns(k){var tb=wizTargetBtn();[[bt,k.top],[bb,k.bot]].forEach(function(p,ri){p[0].innerHTML="";p[1].forEach(function(c,i){var num=ri*3+i+1;var e=document.createElement('button');e.className="abtn"+(num===tb?" wz":"");e.innerHTML='<span class="num">'+num+'</span>';e.setAttribute('aria-label',(c.solo||c.a||'button'));if(c.f)e.addEventListener('click',c.f);p[0].appendChild(e);});});}
  function bindCells(k){var flat=k.top.concat(k.bot);lcd.querySelectorAll('.skc').forEach(function(el,i){var c=flat[i];if(c&&c.f){el.style.cursor='pointer';el.addEventListener('click',c.f);}});}
  function midHtml(){
    if(S.mode==="run")return '<div class="flow"><div class="big">+'+fmt(S.val)+'</div><div class="ug"><div class="u">'+S.unit+'</div><div class="g">'+sub(S.gas)+'</div></div></div><div class="mflab">Mass Flow</div>';
    if(S.mode==="set")return '<div class="note">SETPOINT ('+S.unit+')</div><div class="setv">'+(S.unit==="SCCM"?Math.round(S.edit):S.edit.toFixed(1))+'</div><div class="note">＋/－ 로 조정 후 SET</div>';
    if(S.mode==="menu")return '<div class="mtitle">Main Menu</div><div class="note">위: CONTROL · ABOUT · TARES<br>아래: BASIC CFG · ADV SETUP · MAIN</div>';
    if(S.mode==="cfg")return '<div class="mtitle" style="font-size:17px">Basic Config</div><div class="li">GAS  ('+sub(S.gas)+')</div><div class="li">DEVICE UNITS  ('+S.unit+')</div><div class="li">STP / NTP</div>';
    if(S.mode==="gascat"){var hc='<div class="note" style="text-align:left;margin-bottom:2px">GAS SELECT — CATEGORY</div>';CATS.forEach(function(x,i){hc+='<div class="li'+(i===S.ci?' sel':'')+'">'+x+'</div>';});return hc;}
    if(S.mode==="gas"){var h='<div class="note" style="text-align:left;margin-bottom:2px">GAS SELECT</div>';GASES.forEach(function(x,i){h+='<div class="li'+(i===S.gi?' sel':'')+'">'+sub(x)+(x===S.gas?'  (현재)':'')+'</div>';});return h;}
    if(S.mode==="units"){var h2='<div class="note" style="text-align:left;margin-bottom:2px">DEVICE UNITS · Mass Flow</div>';UNITS.forEach(function(x,i){h2+='<div class="li'+(i===S.ui?' sel':'')+'">'+x+(x===S.unit?'  (현재)':'')+'</div>';});return h2+'<div class="note" style="margin-top:4px">1 SLPM = 1000 SCCM</div>';}
    if(S.mode==="info")return '<div class="mtitle" style="font-size:17px">'+S.msg+'</div><div class="note">BACK / MAIN 으로 돌아가세요.</div>';
    return "";
  }
  function render(){var k=sk();renderBtns(k);lcd.innerHTML='<div class="skrow">'+cellHtml(k.top[0])+cellHtml(k.top[1])+cellHtml(k.top[2])+'</div><div class="mid">'+midHtml()+'</div><div class="skrow">'+cellHtml(k.bot[0])+cellHtml(k.bot[1])+cellHtml(k.bot[2])+'</div>';bindCells(k);wizTick();ph();}
  function enterSet(){S.mode="set";S.edit=conv(S.setpt);render();}
  function chg(step){var s=S.unit==="SCCM"?step*10:step*0.1,mx=conv(50);S.edit=Math.max(0,Math.min(mx,+(S.edit+s).toFixed(S.unit==="SCCM"?0:1)));render();}
  function doSet(){S.setpt=S.unit==="SCCM"?S.edit/1000:S.edit;S.mode="run";render();}
  function toRun(){S.mode="run";render();}
  function enterMenu(){S.mode="menu";render();}
  function enterCfg(){S.mode="cfg";render();}
  function enterGas(){S.mode="gascat";S.ci=0;render();}
  function openCat(){S.mode="gas";S.gi=Math.max(0,GASES.indexOf(S.gas));render();}
  function enterUnits(){S.mode="units";S.ui=Math.max(0,UNITS.indexOf(S.unit));render();}
  function mv(key,arr,d){S[key]=(S[key]+d+arr.length)%arr.length;render();}
  function pickGas(){S.gas=GASES[S.gi];S.mode="run";render();}
  function pickUnit(){S.unit=UNITS[S.ui];S.mode="run";render();}
  function info(m){S.mode="info";S.msg=m;render();}

  // ===== 위저드 =====
  var TASKS={
    flow:{name:"SCCM 유량 설정하기",desc:"SETPT로 유량값 입력",steps:[
      {t:'<b>SETPT</b>(3번)을 누르세요',btn:3,done:function(){return S.mode==='set';}},
      {t:'<b>＋</b>(5번)로 원하는 유량까지 올리세요',btn:5,done:function(){return S.edit>0;}},
      {t:'<b>SET</b>(6번)으로 확정',btn:6,done:function(){return S.mode==='run'&&S.setpt>0;}}],
      done:"완료 — 설정한 유량으로 제어됩니다. (0이면 정지)"},
    gas:{name:"가스 변경하기",desc:"Gas Select로 가스 전환",steps:[
      {t:'<b>MENU</b>(6번) 진입',btn:6,done:function(){return S.mode==='menu';}},
      {t:'<b>BASIC CFG</b>(4번)',btn:4,done:function(){return S.mode==='cfg';}},
      {t:'<b>GAS</b>(4번)',btn:4,done:function(){return S.mode==='gascat';}},
      {t:'<b>SELECT</b>(6번) — Standard',btn:6,done:function(){return S.mode==='gas';}},
      {t:'<b>▲▼</b>로 가스 고르고 <b>SET</b>(6번)',btn:6,done:function(){return S.mode==='run'&&S.gas!=='Air';}}],
      done:"완료 — 가스가 바뀌었습니다. 재시작 없이 즉시 반영."},
    unit:{name:"SLPM ↔ SCCM 전환",desc:"1 SLPM = 1000 SCCM",steps:[
      {t:'<b>MENU</b>(6번) 진입',btn:6,done:function(){return S.mode==='menu';}},
      {t:'<b>BASIC CFG</b>(4번)',btn:4,done:function(){return S.mode==='cfg';}},
      {t:'<b>DEVICE UNITS</b>(5번)',btn:5,done:function(){return S.mode==='units';}},
      {t:'<b>▲▼</b>로 SLPM/SCCM 고르고 <b>SET</b>(6번)',btn:6,done:function(){return S.mode==='run';}}],
      done:"완료 — 단위가 전환됐습니다. 1 SLPM = 1000 SCCM."}
  };
  var WZ={task:null,step:0,fin:false};
  function wizTargetBtn(){ if(!WZ.task||WZ.fin) return 0; return TASKS[WZ.task].steps[WZ.step].btn; }
  function selectTask(id){ WZ.task=id; WZ.step=0; WZ.fin=false; if(id==='gas')S.gas="Air"; if(id==='flow')S.setpt=0; S.mode="run"; render(); }
  function wizReset(){ WZ.task=null;WZ.step=0;WZ.fin=false; renderWiz(); }
  function wizTick(){ if(!WZ.task||WZ.fin) return; var st=TASKS[WZ.task].steps; while(WZ.step<st.length&&st[WZ.step].done())WZ.step++; if(WZ.step>=st.length)WZ.fin=true; renderWiz(); }
  function renderWiz(){
    if(!WZ.task){
      var h='<h2>무엇을 해볼까요?</h2>';
      ["unit","flow","gas"].forEach(function(id){h+='<button class="wtask" onclick="__wz(\''+id+'\')">'+TASKS[id].name+'<small>'+TASKS[id].desc+'</small></button>';});
      h+='<div class="whint">할 일을 고르면 오른쪽에서 한 단계씩 안내합니다. 왼쪽 기기의 <b>빨갛게 깜빡이는 버튼</b>을 누르세요.</div>';
      wizEl.innerHTML=h; return;
    }
    var T=TASKS[WZ.task],st=T.steps;
    var prog='<div class="wprog">';for(var i=0;i<st.length;i++){prog+='<div class="wdot'+(WZ.fin||i<WZ.step?' on':(i===WZ.step?' cur':''))+'"></div>';}prog+='</div>';
    var body;
    if(WZ.fin){ body='<div class="wdone">✓ '+T.done+'</div>'; }
    else{ var s=st[WZ.step]; body='<div class="wstep"><div class="n">'+(WZ.step+1)+'</div><div class="tx">'+s.t+'</div></div>'; }
    wizEl.innerHTML='<h2>'+T.name+'</h2>'+prog+body+'<div class="wact"><button class="wbtn" onclick="__wzr()">← 다른 작업</button>'+(WZ.fin?'<button class="wbtn" onclick="__wz(\''+WZ.task+'\')">다시 하기</button>':'')+'</div>';
  }
  window.__wz=selectTask; window.__wzr=wizReset;

  setInterval(function(){var t=S.setpt+(Math.random()-0.5)*0.03;S.val+=(t-S.val)*0.16;if(Math.abs(S.val)<0.02)S.val=S.setpt;if(S.mode==="run")render();},110);
  render(); renderWiz();

  if(/[?&]embed/.test(location.search)){var st=document.createElement('style');st.textContent='#pumplab-header,#pumplab-footer,.ch-side,.ch-scrim,header.ch-top,.navimro-fab{display:none!important}#pgtitle,#pgsub{display:none!important}html,body{overflow:hidden!important;margin:0;padding:0}.agp{padding:10px 0}';document.head.appendChild(st);}
  var last=0,tm=null;
  function ph(){var el=document.querySelector('.agp')||document.body;var h=Math.ceil(el.getBoundingClientRect().height);if(Math.abs(h-last)<=2)return;last=h;try{parent.postMessage({tcHeight:h},'*');}catch(e){}}
  window.addEventListener('load',ph);[250,800,1600].forEach(function(t){setTimeout(ph,t);});
  window.addEventListener('resize',function(){clearTimeout(tm);tm=setTimeout(ph,120);});
})();
</script>
</body>
</html>
